<!-- Forge — Single File · 100% Offline · No localStorage -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge</title>
    <style>
        /* === Passwort-Modal (nach Datei-Load, wenn Passwort gesetzt) === */
        .forge-pw-modal {
            position: fixed;
            inset: 0;
            background: var(--shadow-70);
            z-index: 9000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .forge-pw-card {
            background: var(--bg-light);
            border: 1px solid var(--overlay-15);
            border-radius: 20px;
            padding: 40px;
            width: 340px;
            box-shadow: 0 20px 60px var(--shadow-50);
            text-align: center;
        }

        .forge-pw-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .forge-pw-error {
            color: var(--incorrect);
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 18px;
            display: none;
        }

        .forge-pw-error.active { display: block; }

        /* === Admin-Layout === */
        .admin-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .admin-nav {
            width: 190px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
        }

        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            background: var(--overlay-5);
            border: 1px solid var(--overlay-10);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            margin-bottom: 5px;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-nav-item:hover { background: var(--overlay-10); }

        .admin-nav-item.active {
            background: var(--overlay-12);
            border-color: var(--primary);
            color: var(--primary);
        }

        .admin-content { flex: 1; min-width: 0; }

        .admin-panel { display: none; }

        .admin-panel.active {
            display: block;
            animation: adminFadeIn 0.25s ease-out;
        }

        @keyframes adminFadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .admin-empty {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.4;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .admin-empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    </style>
    <style>
        /* === 00-base.css === */
        /* 00-base.css - Reset, Variables, Typography, Core Components */



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #F7B801;
            --bg-dark: #1A1A2E;
            --bg-light: #16213E;
            --text: #EAEAEA;
            --correct: #2ECC71;
            --incorrect: #E74C3C;

            /* White overlays */
            --overlay-5: rgba(255, 255, 255, 0.05);
            --overlay-8: rgba(255, 255, 255, 0.08);
            --overlay-10: rgba(255, 255, 255, 0.1);
            --overlay-12: rgba(255, 255, 255, 0.12);
            --overlay-15: rgba(255, 255, 255, 0.15);
            --overlay-20: rgba(255, 255, 255, 0.2);
            --overlay-30: rgba(255, 255, 255, 0.3);

            /* Black shadows */
            --shadow-30: rgba(0, 0, 0, 0.3);
            --shadow-40: rgba(0, 0, 0, 0.4);
            --shadow-50: rgba(0, 0, 0, 0.5);
            --shadow-70: rgba(0, 0, 0, 0.7);
        }


        .hidden { display: none !important; }

        /* Info tables */
        .info-table { width: 100%; border-collapse: collapse; margin: 10px 0 20px; }
        .info-table-sm { width: 100%; border-collapse: collapse; margin: 10px 0 15px; font-size: 0.9rem; }
        .info-table tr,
        .info-table-sm tr { border-bottom: 1px solid rgba(255,255,255,0.15); }
        .info-table-sm tr { border-bottom-color: rgba(255,255,255,0.1); }
        .info-table td,
        .info-table-sm td { padding: 8px; }
        .info-table-sm td { padding: 5px; }
        .td-bold { font-weight: 700; }
        .td-muted { opacity: 0.6; }
        .td-nowrap { white-space: nowrap; }

        /* Section headings & titles */
        .section-heading { color: var(--accent); margin: 20px 0 10px; }
        .section-title { margin: 30px 0 20px 0; font-size: 1.5rem; }

        /* Code inline tags */
        .code-tag { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; }

        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; font-size: 0.88rem; line-height: 1.7; margin: 5px 0 10px 0; }

        /* Radio/checkbox option rows */
        .radio-option { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; }

        /* Common utilities */
        .mb-20 { margin-bottom: 20px; }
        .mt-15 { margin-top: 15px; }
        .mt-30 { margin-top: 30px; }
        .text-muted { font-size: 0.85rem; opacity: 0.7; }


        body {
            font-family: 'Courier New', Courier, monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 78, 137, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }


        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin: 0 0 6px 0;
            animation: fadeInDown 0.6s ease-out;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            background-attachment: fixed;
            padding: 12px 16px 16px 16px;
            margin-left: calc(-50vw + 50%);
            width: 100vw;
            box-shadow: 0 5px 20px var(--shadow-50);
        }

        h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 2.88rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            letter-spacing: -2px;
        }

        .subtitle {
            color: var(--text);
            opacity: 0.7;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }


        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }


        .card {
            background: var(--overlay-5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 60px var(--shadow-30);
            border: 1px solid var(--overlay-10);
            margin-bottom: 27px;
        }


        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 14.4px 36px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #006BA6);
            box-shadow: 0 10px 30px rgba(0, 78, 137, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 15px 40px rgba(0, 78, 137, 0.4);
        }

        .btn-small {
            padding: 10px 24px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--overlay-8);
            border: 2px solid var(--overlay-10);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--overlay-12);
        }

        select option {
            background: #1A1A2E;
            color: #EAEAEA;
        }

        label {
            display: block;
            margin: 20px 0 5px 0;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }


        /* === 01-screens.css === */
        /* 01-screens.css - User Selection, Quiz, Results, Admin Nav */
        .user-select {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 30px 0;
        }


        .user-select .last-row-spacer {
            display: none;
        }

        @media (max-width: 1200px) {
            .user-select {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 900px) {
            .user-select {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .user-select {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .user-card {
            background: var(--overlay-8);
            padding: 15.75px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--overlay-10);
            text-align: center;
            position: relative;
            overflow: hidden;
        }


        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: var(--xp-progress, 0%);
            border: 2px solid #FF5F15;
            border-right: none;
            border-radius: 15px 0 0 15px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .user-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: var(--xp-progress, 0%);
            height: 100%;
            width: calc(100% - var(--xp-progress, 0%));
            border: 2px solid var(--overlay-10);
            border-left: none;
            border-radius: 0 15px 15px 0;
            box-sizing: border-box;
            pointer-events: none;
        }

        .user-card:hover {
            background: var(--overlay-12);
            transform: translateY(-5px);
        }

        .user-card.selected {
            background: rgba(247, 184, 1, 0.15);
        }

        .user-card.selected::before {
            border-color: var(--accent);
        }

        .user-card.selected::after {
            border-color: var(--accent);
            opacity: 0.5;
        }

        .user-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
            border: 2px solid;
            position: relative;
            overflow: hidden;
        }

        .user-avatar::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .user-info {
            flex: 1;
            text-align: left;
        }

        .user-name {
            font-size: 0.91rem;
            font-weight: 700;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-level {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: var(--bg-dark);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .user-xp-container {
            margin-top: 5px;
        }

        .user-xp-bar {
            height: 6px;
            background: var(--overlay-10);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .user-xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }

        .user-xp-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, transparent, var(--overlay-30), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .user-xp-text {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-top: 3px;
        }

        .user-stats {
            font-size: 0.63rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .question-container {
            margin: 40px 0;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--overlay-10);
            gap: 10px;
            flex-wrap: nowrap;
        }

        .question-number {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
        }


        .imagemap-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            border: 2px solid rgba(255,255,255,0.15);
            touch-action: none;
        }
        .imagemap-container img {
            width: 100%;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
        .imagemap-marker {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.4);
        }
        .imagemap-marker.player { background: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.4), 0 0 15px rgba(52,152,219,0.5); }
        .imagemap-marker.correct { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46,204,113,0.4), 0 0 15px rgba(46,204,113,0.5); }
        .imagemap-marker.incorrect { background: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,0.4), 0 0 15px rgba(231,76,60,0.5); }
        .imagemap-marker.pulse { animation: markerPulse 1.5s infinite; }
        @keyframes markerPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }
        .imagemap-zone-overlay {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        .imagemap-scroll-wrapper {
            border-radius: 12px;
        }

        .imagemap-editor {
            position: relative;
            border: 2px dashed var(--accent);
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            margin: 15px 0;
            max-height: 75vh;
        }
        .imagemap-editor img {
            width: 100%;
            display: block;
            user-select: none;
        }
        .imagemap-editor-point {
            position: absolute;
            width: 16px; height: 16px;
            background: #e74c3c;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: move;
            z-index: 20;
            font-size: 0.6rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }
        .imagemap-editor-radius {
            position: absolute;
            border: 1.5px dashed rgba(46,204,113,0.7);
            border-radius: 50%;
            background: rgba(46,204,113,0.12);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 15;
        }

        .quiz-xp-counter {
            font-size: 1rem;
            font-weight: 700;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(46, 204, 113, 0.25);
            transition: all 0.3s ease;
        }
        .quiz-xp-counter.xp-bump {
            transform: scale(1.15);
            color: #f1c40f;
            background: rgba(241, 196, 0, 0.15);
            border-color: rgba(241, 196, 0, 0.35);
        }

        .question-text {
            font-size: 1.62rem;
            font-weight: 700;
            margin: 27px 0;
            line-height: 1.4;
        }

        .question-media {
            margin: 30px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px var(--shadow-30);
            width: var(--quiz-img-width, 80%);
            max-width: 100%;
        }

        .question-media img,
        .question-media video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }

        .answer-btn {
            background: var(--overlay-8);
            border: 2px solid var(--overlay-20);
            color: var(--text);
            padding: 20px 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
            z-index: -1;
        }

        .answer-btn:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .answer-btn:hover::before {
            width: 100%;
        }

        .answer-btn.selected {
            border-color: var(--accent);
            background: rgba(247, 184, 1, 0.2);
        }

        .answer-btn.correct {
            border-color: var(--correct);
            background: rgba(46, 204, 113, 0.2);
        }

        .answer-btn.incorrect {
            border-color: var(--incorrect);
            background: rgba(231, 76, 60, 0.2);
        }

        .text-answer-input.correct  { background: rgba(46, 204, 113, 0.2); border-color: var(--correct); }
        .text-answer-input.incorrect { background: rgba(231, 76, 60, 0.2);  border-color: var(--incorrect); }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }





        .answer-checkbox-container {
            background: var(--overlay-8);
            border: 2px solid var(--overlay-20);
            padding: 14px 16px;
            border-radius: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            cursor: pointer;  
            position: relative;
            display: flex;
            align-items: center;
            min-height: 22px;
        }


        .answer-checkbox-container:hover {
            background: var(--overlay-12);
            border-color: var(--primary);
            transform: translateX(5px);  
        }


        .answer-checkbox-container.correct {
            border-color: var(--correct);
            background: rgba(46, 204, 113, 0.2);
        }


        .answer-checkbox-container.incorrect {
            border-color: var(--incorrect);
            background: rgba(231, 76, 60, 0.2);
        }


        .answer-checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;  
            width: 100%;  
        }


        .answer-checkbox {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }


        .answer-checkbox-custom {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            margin-right: 14px;
            background: var(--overlay-10);
            border: 2px solid var(--overlay-30);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            font-family: monospace;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }


        .answer-checkbox-container:hover .answer-checkbox-custom {
            border-color: var(--primary);
            color: var(--primary);
        }


        .answer-checkbox:checked + .answer-checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }


        .answer-checkbox:disabled + .answer-checkbox-custom {
            cursor: not-allowed;
            opacity: 0.6;
        }


        .answer-checkbox-container.correct .answer-checkbox-custom {
            background: var(--correct);
            border-color: var(--correct);
            color: #fff;
        }


        .answer-checkbox-container.incorrect .answer-checkbox-custom {
            background: var(--incorrect);
            border-color: var(--incorrect);
            color: #fff;
        }

        .answer-text {
            font-size: 1rem;
            line-height: 28px;
            pointer-events: none; 
            display: flex;
            align-items: center;
        }

        .progress-bar {
            height: 8px;
            background: var(--overlay-10);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 27px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .results-container {
            text-align: center;
            padding: 40px 0;
        }

        .results-score {
            font-size: 6rem;
            font-weight: 800;

        // === 01-constants.js ===

        };


        function getCorrectTextAnswers(q) {
            // 1. Kanonisches Format (nach normalizeQuestion)
            if (q.answers && q.answers[0] && Array.isArray(q.answers[0].correctAnswers)) {
                return q.answers[0].correctAnswers;
            }
            // 2. correctAnswer als Array
            const ca = q.correctAnswer || q.antwort;
            if (Array.isArray(ca)) return ca;
            // 3. correctAnswer als String (NICHT splitten — Komma kann Teil der Antwort sein)
            if (typeof ca === 'string' && ca.trim()) return [ca.trim()];
            return [];
        }

        const LIMITS = {

        };

        };

        // === 02-toast-dialog.js ===
        // 02-toast-dialog.js
        // Toast notification system and GameDialog
        // ============================================================

        // TOAST — Einheitliches Benachrichtigungs-System


        const Toast = {
            _container: null,
    
            _ensureContainer() {
                if (!this._container) {
                    this._container = document.createElement('div');
                    this._container.id = 'toastContainer';
                    this._container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:100000;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
                    document.body.appendChild(this._container);
                }
                return this._container;
            },
    
    
            show(message, type = 'info', duration = CONFIG.UI.TOAST_DURATION_MS) {
                const container = this._ensureContainer();
                const toast = document.createElement('div');
                const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
                const colors = { 
                    info: 'rgba(52,152,219,0.95)', 
                    success: 'rgba(46,204,113,0.95)', 
                    warning: 'rgba(241,196,15,0.95)', 
                    error: 'rgba(231,76,60,0.95)' 
                };
                toast.style.cssText = `background:${colors[type] || colors.info};color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;pointer-events:auto;cursor:pointer;opacity:0;transform:translateX(100%);transition:all ${CONFIG.UI.TOAST_FADE_MS}ms ease;max-width:350px;box-shadow:0 4px 15px rgba(0,0,0,0.3);`;
                toast.textContent = `${icons[type] || ''} ${message}`;
                toast.onclick = () => this._remove(toast);
                container.appendChild(toast);

        // === 03-eventbus.js ===
        // 03-eventbus.js
        // EventBus publish/subscribe system
        // ============================================================

        // EVENT BUS — Publish/Subscribe für Plugin-Kommunikation


        const EventBus = {
            // Event Catalog — Dokumentation aller Events im System
            EVENTS: {
                DATA_LOADED:          'data:loaded',           // { questions, users, source }
                USER_SELECTED:        'user:selected',         // { user }
                QUIZ_STARTED:         'quiz:started',          // { user, questionCount }
                QUIZ_QUESTION:        'quiz:questionDisplayed', // { index, question }
                QUIZ_ANSWER:          'quiz:answerSubmitted',  // { questionId, correct, xp }
                QUIZ_COMPLETED:       'quiz:completed',        // { user, correct, total, xp, pct }
                QUIZ_RESTARTED:       'quiz:restarted',        // {}
                QUIZ_ABANDONED:       'quiz:abandoned',        // { xp }
                ABILITY_USED:         'ability:used',          // { ability, user }
                PLUGINS_INITIALIZED:  'plugins:initialized',   // { count }
                PLUGIN_ENABLED:       'plugin:enabled',        // { name }
                PLUGIN_DISABLED:      'plugin:disabled',       // { name }
            },

            _listeners: {},
    
    
            on(event, callback, context) {
                if (!this._listeners[event]) this._listeners[event] = [];
                const entry = { fn: callback, ctx: context || 'anonymous' };
                this._listeners[event].push(entry);
                // Rückgabe: Unsubscribe-Funktion
                return () => {
                    this._listeners[event] = this._listeners[event].filter(e => e !== entry);
                };
            },
    
    
            once(event, callback, context) {
                const wrapper = (...args) => {
                    unsub();
                    callback(...args);
                };
                wrapper._originalCallback = callback;
                const unsub = this.on(event, wrapper, context);
                return unsub;
            },
    
    
            emit(event, data) {
                const listeners = this._listeners[event];
                if (!listeners || listeners.length === 0) return;
        
                for (const entry of listeners) {
                    try {
                        entry.fn(data);
                    } catch (err) {
                        console.error(`[EventBus] Error in "${event}" handler (${entry.ctx}):`, err);
                    }
                }
            },
    
    
            off(event, callback) {
                if (!callback) {
                    delete this._listeners[event];
                } else if (this._listeners[event]) {
                    this._listeners[event] = this._listeners[event].filter(e =>
                        e.fn !== callback && e.fn._originalCallback !== callback
                    );
                }
            },
    
    
            debug() {
                console.group('[EventBus] Registered Events');
                for (const [event, listeners] of Object.entries(this._listeners)) {
                    console.log(`  ${event}: ${listeners.length} listener(s) [${listeners.map(l => l.ctx).join(', ')}]`);
                }
                console.groupEnd();
            }
        };

        // === 06-plugin-registry.js ===
        // 06-plugin-registry.js
        // PluginRegistry plugin management
        // ============================================================

        // PLUGIN REGISTRY — Plugin-Verwaltung


        const PluginRegistry = {
            _plugins: {},
            _initOrder: [],
    
    
            register(name, plugin, options = {}) {
                if (this._plugins[name]) {
                    console.warn(`[PluginRegistry] Plugin "${name}" ist bereits registriert.`);
                    return;
                }
        
                this._plugins[name] = {
                    instance: plugin,
                    name,
                    enabled: true,
                    initialized: false,
                    category: options.category || 'feature',
                    description: options.description || '',
                    dependencies: options.dependencies || [],
                    required: options.required || false
                };
        
                this._initOrder.push(name);
                console.log(`[PluginRegistry] Plugin "${name}" registriert (${options.category || 'feature'})`);
            },
    
    
            initAll() {
                console.group('[PluginRegistry] Initialisiere Plugins...');
                for (const name of this._initOrder) {
                    this._initPlugin(name);
                }
                console.groupEnd();
                EventBus.emit('plugins:initialized', { count: this._initOrder.length });
            },
    
            _initStack: new Set(),

            _initPlugin(name) {
                const entry = this._plugins[name];
                if (!entry || entry.initialized) return;

                // Zirkuläre Abhängigkeit erkennen
                if (this._initStack.has(name)) {
                    const chain = [...this._initStack, name].join(' → ');
                    console.error(`[PluginRegistry] Zirkuläre Abhängigkeit erkannt: ${chain}`);
                    return;
                }
                this._initStack.add(name);

                // Abhängigkeiten zuerst
                for (const dep of entry.dependencies) {
                    if (!this._plugins[dep]) {
                        console.error(`[PluginRegistry] Plugin "${name}" benötigt "${dep}", aber es ist nicht registriert!`);
                        this._initStack.delete(name);
                        return;
                    }
                    this._initPlugin(dep);
                }
        
                try {
                    if (typeof entry.instance.init === 'function') {
                        entry.instance.init();
                    }
                    entry.initialized = true;
                    console.log(`  ✅ ${name}`);
                } catch (err) {
                    console.error(`  ❌ ${name}:`, err);
                }
                this._initStack.delete(name);
            },
    
    
            get(name) {
                const entry = this._plugins[name];
                return entry ? entry.instance : null;
            },
    
    
            isEnabled(name) {
                const entry = this._plugins[name];
                return entry ? entry.enabled : false;
            },
    
    
            enable(name) {
                const entry = this._plugins[name];
                if (!entry) return false;
        
                entry.enabled = true;
                if (typeof entry.instance.enable === 'function') {
                    entry.instance.enable();
                }

                if (typeof PLUGIN_SETTINGS_MAP !== 'undefined') {
                    const settingsKey = PLUGIN_SETTINGS_MAP[name];
                    if (settingsKey && typeof getMG === 'function') {
                        const mg = getMG();
                        if (mg[settingsKey]) mg[settingsKey].enabled = true;
                    }
                }
        
                EventBus.emit('plugin:enabled', { name });
                console.log(`[PluginRegistry] Plugin "${name}" aktiviert`);
                return true;
            },
    
    
            disable(name) {
                const entry = this._plugins[name];
                if (!entry || entry.required) return false;
        
                entry.enabled = false;
                if (typeof entry.instance.disable === 'function') {
                    entry.instance.disable();
                }

                if (typeof PLUGIN_SETTINGS_MAP !== 'undefined') {
                    const settingsKey = PLUGIN_SETTINGS_MAP[name];
                    if (settingsKey && typeof getMG === 'function') {
                        const mg = getMG();
                        if (mg[settingsKey]) mg[settingsKey].enabled = false;
                    }
                }

                for (const [depName, depEntry] of Object.entries(this._plugins)) {
                    if (depEntry.enabled && depEntry.dependencies && depEntry.dependencies.includes(name)) {
                        console.warn(`[PluginRegistry] Warnung: "${depName}" hängt von "${name}" ab und ist noch aktiv.`);
                    }
                }
        
                EventBus.emit('plugin:disabled', { name });
                console.log(`[PluginRegistry] Plugin "${name}" deaktiviert`);
                return true;
            },
    
    
            getAll() {
                return Object.values(this._plugins).map(p => ({
                    name: p.name,
                    enabled: p.enabled,
                    initialized: p.initialized,
                    category: p.category,
                    description: p.description,
                    required: p.required
                }));
            },
    
    
            getConfig() {
                const config = {};
                for (const [name, entry] of Object.entries(this._plugins)) {
                    config[name] = { enabled: entry.enabled };
                    if (typeof entry.instance.getConfig === 'function') {
                        config[name].settings = entry.instance.getConfig();
                    }
                }
                return config;
            },
    
    
            loadConfig(config) {
                if (!config) return;
                for (const [name, cfg] of Object.entries(config)) {
                    const entry = this._plugins[name];
                    if (!entry) continue;
            
                    // Enable/Disable über die offiziellen Methoden,
                    // damit Plugin-eigene enable()/disable()-Hooks feuern
                    if (cfg.enabled === false && !entry.required) {
                        this.disable(name);
                    } else if (cfg.enabled === true && !entry.enabled) {
                        this.enable(name);
                    }
            
                    if (cfg.settings && typeof entry.instance.loadConfig === 'function') {
                        entry.instance.loadConfig(cfg.settings);
                    }
                }
            }
        };

        // === 07-event-delegation.js ===
        // 07-event-delegation.js
        // Event delegation system - replaces inline onclick/onchange handlers
        // ============================================================

        // EVENT DELEGATION — Ersetzt inline onclick/onchange durch data-Attribute
        //
        // Nutzung in HTML:
        //   <button data-action="startQuiz" data-plugin="ClassicQuizPlugin">Start</button>
        //   <button data-action="showAdminSection" data-args='["settings"]'>Settings</button>
        //   <input data-change="handleSlider" data-args='["volume"]'>
        //
        // data-action:  Methodenname (click)
        // data-change:  Methodenname (change/input)
        // data-plugin:  Optional — Plugin-Name (via PluginRegistry)
        // data-args:    Optional — JSON-Array mit Argumenten

        const EventDelegation = {

            init() {
                // Click-Events
                document.body.addEventListener('click', (e) => {
                    // data-trigger: Klick auf anderes Element weiterleiten (z.B. File-Inputs)
                    const trigger = e.target.closest('[data-trigger]');
                    if (trigger) {
                        const target = document.getElementById(trigger.dataset.trigger);
                        if (target) target.click();
                        return;
                    }
                    // data-toggle-overlay: Overlay ein-/ausblenden
                    const toggle = e.target.closest('[data-toggle-overlay]');
                    if (toggle) {
                        const overlay = document.getElementById(toggle.dataset.toggleOverlay);
                        if (!overlay) return;
                        const show = toggle.dataset.overlayShow !== 'false';
                        if (show) {
                            overlay.classList.add('active');
                            document.body.style.overflow = 'hidden';
                        } else {
                            overlay.classList.remove('active');
                            document.body.style.overflow = '';
                        }
                        return;
                    }
                    // data-action: Standard-Handler
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    e.preventDefault();
                    this._dispatch(target.dataset.action, target.dataset.plugin, target.dataset.args, e, target);
                });

                // Change-Events (select, checkbox, file inputs)
                document.body.addEventListener('change', (e) => {
                    const target = e.target.closest('[data-change]');
                    if (!target) return;
                    this._dispatch(target.dataset.change, target.dataset.plugin, target.dataset.args, e, target);
                });

                // Input-Events (range sliders, text inputs)
                document.body.addEventListener('input', (e) => {
                    const target = e.target.closest('[data-input]');
                    if (!target) return;
                    this._dispatch(target.dataset.input, target.dataset.plugin, target.dataset.args, e, target);
                });

                // Submit-Events (forms)
                document.body.addEventListener('submit', (e) => {
                    const target = e.target.closest('[data-submit]');
                    if (!target) return;
                    e.preventDefault();
                    this._dispatch(target.dataset.submit, target.dataset.plugin, target.dataset.args, e, target);
                });
            },

            _dispatch(action, pluginName, argsJson, event, element) {
                const args = argsJson ? JSON.parse(argsJson) : [];

                // Plugin-Methode aufrufen
                if (pluginName) {
                    const plugin = PluginRegistry.get(pluginName);
                    if (!plugin) {
                        console.warn('[EventDelegation] Plugin not found:', pluginName);
                        return;
                    }
                    if (!PluginRegistry.isEnabled(pluginName)) return;
                    if (typeof plugin[action] === 'function') {
                        return plugin[action](...args, event, element);
                    }
                    console.warn('[EventDelegation] Method not found:', pluginName + '.' + action);
                    return;
                }

                // Globale Funktion aufrufen
                if (typeof window[action] === 'function') {
                    return window[action](...args, event, element);
                }

                console.warn('[EventDelegation] Handler not found:', action);
            }
        };

        function hasStableId(id) {
            return id && !id.startsWith('Q_') && !/^\d+$/.test(String(id));
        }

        function normalizeQuestion(q) {
            // Text der Frage
            const text = q.text || q.frage || '';

            // questionId bestimmen:
            // - Stabile ID (kein Q_-Präfix, nicht rein numerisch): beibehalten
            // - Q_-Präfix: beibehalten (Migration später)
            // - Fehlt: neue stabile ID vergeben
            const oldQuestionId = q.questionId;
            function resolveId() {
                if (hasStableId(oldQuestionId)) return oldQuestionId;
                if (oldQuestionId && oldQuestionId.startsWith('Q_')) return oldQuestionId;
                return typeof assignStableId === 'function'
                    ? assignStableId(q._fileGroup || 'Manuell', questions)
                    : generateQuestionHash(q);
            }

            // Imagemap-Frage?
            if (q.type === QUESTION_TYPES.IMAGEMAP) {
                return {
                    id: q.id,
                    questionId: resolveId(),
                    _contentHash: typeof generateQuestionHash === 'function' ? generateQuestionHash(q) : null,
                    text: text,
                    type: QUESTION_TYPES.IMAGEMAP,
                    targets: q.targets || (q.target ? [q.target] : []),
                    active: q.active !== false,
                    media: q.media || null,
                    explanation: q.explanation || null,
                    explanationMedia: q.explanationMedia || null,
                    hint: q.hint || null,
                    hintMedia: q.hintMedia || null
                };
            }

            // Freitext-Frage?
            if (q.typ === 'freitext' || q.type === QUESTION_TYPES.TEXT || q.antwort || (q.correctAnswer && !q.answers)) {
                // Kanonisches Format: immer Array
                const textAnswers = getCorrectTextAnswers(q);
                return {
                    id: q.id,
                    questionId: resolveId(),
                    _contentHash: typeof generateQuestionHash === 'function' ? generateQuestionHash(q) : null,
                    text: text,
                    type: QUESTION_TYPES.TEXT,
                    answers: [{ type: QUESTION_TYPES.TEXT, correctAnswers: textAnswers }],
                    correctAnswer: textAnswers,
                    active: q.active !== false,
                    media: q.media || null,
                    explanation: q.explanation || null,
                    explanationMedia: q.explanationMedia || null,
                    hint: q.hint || null,
                    hintMedia: q.hintMedia || null
                };
            }

            // Multiple-Choice
            let rawAnswers = q.answers || q.antworten || [];
            const correctIndex = q.correct !== undefined ? q.correct : (q.richtig !== undefined ? q.richtig : 0);

            // Antworten in einheitliches Format konvertieren
            // Kann sein: Array von Strings ODER Array von Objekten mit {text, correct}
            const answers = rawAnswers.map((ans, idx) => {
                if (typeof ans === 'string') {
                    // Altes Format: Array von Strings mit separatem richtig-Index
                    return {
                        text: ans,
                        correct: idx === correctIndex
                    };
                } else if (typeof ans === 'object' && ans !== null) {
                    // Neues Format: Objekt mit text und correct
                    return {
                        text: ans.text || ans,
                        correct: ans.correct === true
                    };
                }
                return { text: String(ans), correct: false };
            });

            return {
                id: q.id,
                questionId: resolveId(),
                _contentHash: typeof generateQuestionHash === 'function' ? generateQuestionHash(q) : null,
                text: text,
                type: QUESTION_TYPES.MULTIPLE_CHOICE,
                answers: answers,
                active: q.active !== false,
                media: q.media || null,
                explanation: q.explanation || null,
                explanationMedia: q.explanationMedia || null,
                hint: q.hint || null,
                hintMedia: q.hintMedia || null
            };
        }


        // === 32-file-io.js ===

        // File I/O: Load, Save, Export, Import functions

        async function loadFromFolderInput(event) {
          try {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            // FileList → Array konvertieren für sichere Iteration
            const fileArray = Array.from(files);

            // Ordnername aus dem ersten Dateipfad extrahieren
            const firstPath = fileArray[0].webkitRelativePath;
            loadedFolderName = firstPath.split('/')[0];

            let masterData = null;
            let playerFiles = [];

            // Alle JSON-Dateien sammeln und lesen
            const readPromises = [];

            for (let fi = 0; fi < fileArray.length; fi++) {
                (function(file) {
                if (file.name.endsWith('.json')) {
                    const promise = new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                let raw = e.target.result;
                                let data;
                                try { data = JSON.parse(raw); } catch(e1) {
                                    try { data = JSON.parse(decodeURIComponent(escape(atob(raw.trim())))); }
                                    catch(e2) { throw new Error('Ungültiges Format'); }
                                }
                                resolve({
                                    name: file.name,
                                    data: data,
                                    lastModified: file.lastModified
                                });
                            } catch (err) {
                                console.warn('Datei konnte nicht gelesen werden:', file.name, err.message);
                                resolve(null);
                            }
                        };
                        reader.onerror = () => { console.warn('Lesefehler:', file.name); resolve(null); };
                        reader.readAsText(file);
                    });
                    readPromises.push(promise);
                }
                })(fileArray[fi]);
            }

            const results = await Promise.all(readPromises);

            // Ergebnisse verarbeiten
            let masterFiles = [];
            let questionFiles = [];
            const skippedFiles = [];
            const unrecognizedJsonFiles = [];
            for (const result of results) {
                if (!result) continue;

                // 01: Master (Settings + Backups)
                if (result.name.startsWith('02_quiz-master') || result.name.startsWith('02_QUIZ-MASTER') || result.name === 'quiz-master.json') {
                    masterFiles.push(result);
                }
                // 02: Operator (Spielerdaten) — NUR exakter Präfix
                else if (result.name.startsWith('04_operator_') || result.name.startsWith('04_Operator_') || result.name.startsWith('spieler-')) {
                    playerFiles.push(result);
                }
                // 03: Questions (Fragenkataloge) — NUR exakter Präfix
                else if (result.name.startsWith('03_questions_') || result.name.startsWith('03_Questions_')) {
                    questionFiles.push(result);
                }
                // Fallback: JSON mit questions-Array → als Fragen laden, aber warnen
                else if (result.data && result.data.questions && Array.isArray(result.data.questions)) {
                    questionFiles.push(result);
                    unrecognizedJsonFiles.push(result.name);
                }
                // Nicht erkannt → ignorieren
                else {
                    skippedFiles.push(result.name);
                }
            }

            // Warnung bei nicht korrekt benannten Dateien (werden trotzdem geladen)
            if (unrecognizedJsonFiles.length > 0) {
                console.warn('Fragen-Dateien ohne korrekten Präfix:', unrecognizedJsonFiles.join(', '));
                let warnMsg = '⚠️ ' + unrecognizedJsonFiles.length + ' Datei(en) wurden geladen, haben aber keinen Standard-Namen:\n\n';
                unrecognizedJsonFiles.forEach(function(f) { warnMsg += '• ' + f + '\n'; });
                warnMsg += '\nBitte umbenennen zu: 03_questions_THEMA_DATUM.json\n';
                warnMsg += 'Beim nächsten Export wird der Name automatisch korrekt gesetzt.';
                Toast.show(warnMsg, 'info');
            }
            console.log('Ordner-Laden: ' + results.filter(Boolean).length + ' JSON-Dateien, ' + masterFiles.length + ' Master, ' + questionFiles.length + ' Fragen-Dateien, ' + playerFiles.length + ' Spieler, ' + skippedFiles.length + ' übersprungen');
            if (playerFiles.length > 0) console.log('Spieler-Dateien:', playerFiles.map(function(p){ return p.name; }).join(', '));
            if (questionFiles.length > 0) console.log('Fragen-Dateien:', questionFiles.map(function(p){ return p.name; }).join(', '));
            if (skippedFiles.length > 0) console.log('Übersprungen:', skippedFiles.join(', '));

            // Neueste Master-Datei verwenden
            if (masterFiles.length > 0) {
                masterFiles.sort((a, b) => b.lastModified - a.lastModified);
                masterData = masterFiles[0].data;
            }

            // Wenn keine Master-Datei, erstelle Standard
            if (!masterData) {
                masterData = {
                    version: CONFIG.FILE.VERSION,
                    lastBackup: null,
                    settings: quizSettings
                };
            }

            // Master-Daten laden (keine Fragen mehr im Master!)
            quizSettings = { ...quizSettings, ...masterData.settings };
            ensureSettingsDefaults(quizSettings);

            // Fähigkeiten-Overrides anwenden
            if (quizSettings.abilityOverrides) {
                Object.keys(quizSettings.abilityOverrides).forEach(function(key) {
                    var ov = quizSettings.abilityOverrides[key];
                    if (ov && ov.earnPer && ABILITY_DEFS[key]) {
                        ABILITY_DEFS[key].earnPer = ov.earnPer;
                        if (AbilityPlugin && AbilityPlugin.DEFS && AbilityPlugin.DEFS[key]) {
                            AbilityPlugin.DEFS[key].earnPer = ov.earnPer;
                        }
                    }
                });
            }

            // Plugin-Konfiguration aus Master laden (abwärtskompatibel)
            if (masterData.pluginConfig) {
                PluginRegistry.loadConfig(masterData.pluginConfig);
            }

            // Fragen aus 03_questions-Dateien laden
            questions = [];
            loadedQuestionFiles = [];
            if (questionFiles.length > 0) {
                questionFiles.forEach(qf => {
                    const qData = qf.data;
                    const theme = qData.theme || 'Unbekannt';
                    const isCore = /^03_questions_CORE/i.test(qf.name);
                    const qList = qData.questions || [];
                    let qErrors = 0;
                    qList.forEach((q, qi) => {
                        try {
                            const normalized = normalizeQuestion(q);
                            // Duplikat-Check: questionId ODER Text (verhindert doppelte Fragen aus mehreren Dateien)
                            const isDupe = questions.some(function(eq) {
                                if (normalized.questionId && eq.questionId === normalized.questionId) return true;
                                return (eq.text || '').trim().toLowerCase() === (normalized.text || '').trim().toLowerCase();
                            });
                            if (isDupe) { qErrors++; return; }
                            // Eindeutige ID sicherstellen (verschiedene Dateien können gleiche IDs haben)
                            normalized.id = Date.now() + questions.length + qi;
                            normalized.sourceFile = qf.name;
                            normalized.theme = q.theme || theme;
                            normalized._fileGroup = q._fileGroup || q.theme || theme;
                            normalized.isCore = isCore;
                            questions.push(normalized);
                        } catch(qErr) {
                            qErrors++;
                            console.warn('Frage ' + qi + ' in ' + qf.name + ' übersprungen:', qErr.message);
                        }
                    });
                    loadedQuestionFiles.push({
                        name: qf.name,
                        theme: theme,
                        count: qList.length - qErrors,
                        lastModified: new Date(qf.lastModified).toLocaleString()
                    });
                    if (qErrors > 0) console.warn(qf.name + ': ' + qErrors + ' Fragen übersprungen (Fehler)');
                });
            } else if (masterData.questions && masterData.questions.length > 0) {
                // Rückwärtskompatibel: Fragen aus altem Master laden
                questions = masterData.questions.map(normalizeQuestion);
                questions.forEach(function(q, idx) {
                    if (!q._fileGroup) q._fileGroup = q.theme || 'Legacy';
                    q.id = Date.now() + idx; // Eindeutige ID sicherstellen
                });
                loadedQuestionFiles.push({
                    name: '(aus Master)',
                    theme: 'Legacy',
                    count: questions.length,
                    lastModified: '-'
                });
            }

            // Spieler aus Dateien laden (neueste Version pro Spieler)
            users = [];
            const playersByName = {};
            const playerFileCount = {}; // Zähle Dateien pro Spieler

            playerFiles.forEach(pf => {
                if (!pf.data || !pf.data.name) {
                    console.warn('Spieler-Datei ohne name-Feld übersprungen:', pf.name, Object.keys(pf.data || {}));
                    return;
                }
                const playerName = pf.data.name;

                // Dateien zählen
                playerFileCount[playerName] = (playerFileCount[playerName] || 0) + 1;

                // Nur neueste Version merken
                if (!playersByName[playerName] || pf.lastModified > playersByName[playerName].lastModified) {
                    playersByName[playerName] = pf;
                }
            });

            // Duplikate zählen (wird in refreshPlayerFiles angezeigt, kein Popup)

            // Geladene Spieler-Dateien merken
            loadedPlayerFiles = Object.values(playersByName).map(pf => ({
                name: pf.name,
                playerName: pf.data.name,
                lastModified: new Date(pf.lastModified).toLocaleString(),
                totalFiles: playerFileCount[pf.data.name] || 1
            }));

            Object.values(playersByName).forEach(pf => {
                users.push(pf.data);
            });

            // Cross-Reference: Phone-Joker System (3 Phasen)
            const jokerExpiryMs = CONFIG.TIMER.GHOST_CLEANUP_MONTHS * 30 * 24 * 60 * 60 * 1000;
            const jokerExpiryThreshold = Date.now() - jokerExpiryMs;

            // Phase 1: Resolved Joker verarbeiten → Sender-Bonus berechnen
            // B hat eine Joker-Frage beantwortet (resolved:true auf B.pendingPhoneJoker).
            // Jetzt A's sentPhoneJokers als resolved markieren + Bonus auf A schreiben.
            users.forEach(function(target) {
                if (!target.pendingPhoneJoker) return;
                target.pendingPhoneJoker.forEach(function(entry) {
                    if (!entry.resolved) return;
                    var sender = users.find(function(u){ return u.name === entry.from; });
                    if (!sender || !sender.sentPhoneJokers) return;
                    var sentEntry = sender.sentPhoneJokers.find(function(s) {
                        return s.questionId === entry.questionId && s.targetName === target.name && !s.resolved;
                    });
                    if (!sentEntry) return; // bereits verarbeitet
                    // Sender's sent-Eintrag als resolved markieren (wird in Phase 2 aufgeräumt)
                    sentEntry.resolved = true;
                    // Bonus nur einmal anwenden (bonusApplied verhindert Doppel-Bonus)
                    if (!entry.bonusApplied && entry.correct) {
                        var xpSettings = quizSettings.xpSystem || {};
                        var bonusXP = (xpSettings.correctAnswerXP || 10) * 5;
                        if (!sender.pendingJokerBonus) sender.pendingJokerBonus = 0;
                        sender.pendingJokerBonus += bonusXP;
                    }
                    entry.bonusApplied = true;
                });
            });

            // Phase 2: sentPhoneJokers aufräumen + pending aus sent erzeugen
            users.forEach(function(sender) {
                if (!sender.sentPhoneJokers || sender.sentPhoneJokers.length === 0) return;
                // Ghost-Joker Cleanup: resolved, abgelaufene, inaktive Fragen entfernen
                sender.sentPhoneJokers = sender.sentPhoneJokers.filter(function(joker) {
                    if (joker.resolved) return false;
                    if (joker.date && new Date(joker.date).getTime() < jokerExpiryThreshold) return false;
                    var qExists = questions.some(function(qq){ return qq.questionId === joker.questionId && qq.active !== false; });
                    return qExists;
                });
                // Pending-Einträge erzeugen für offene sent-Einträge
                sender.sentPhoneJokers.forEach(function(joker) {
                    var target = users.find(function(u){ return u.name === joker.targetName; });
                    if (target) {
                        if (!target.pendingPhoneJoker) target.pendingPhoneJoker = [];
                        var exists = target.pendingPhoneJoker.some(function(p) {
                            return p.from === joker.from && p.questionId === joker.questionId;
                        });
                        if (!exists) {
                            target.pendingPhoneJoker.push({
                                from: joker.from, questionId: joker.questionId,
                                questionText: joker.questionText, date: joker.date
                            });
                        }
                    }
                });
            });

            // Phase 3: Verwaiste resolved-Einträge aufräumen
            // Wenn der Sender keinen passenden sent-Eintrag mehr hat (schon gespeichert),
            // kann der resolved-Eintrag beim Empfänger entfernt werden.
            users.forEach(function(target) {
                if (!target.pendingPhoneJoker) return;
                target.pendingPhoneJoker = target.pendingPhoneJoker.filter(function(entry) {
                    if (!entry.resolved) return true; // offene behalten
                    // Abgelaufene resolved-Einträge entfernen
                    if (entry.date && new Date(entry.date).getTime() < jokerExpiryThreshold) return false;
                    // Wenn Sender keinen passenden sent-Eintrag mehr hat → Quittung entfernen
                    var sender = users.find(function(u){ return u.name === entry.from; });
                    if (!sender || !sender.sentPhoneJokers) return false;
                    return sender.sentPhoneJokers.some(function(s) {
                        return s.questionId === entry.questionId && s.targetName === target.name;
                    });
                });
            });

            // Modus setzen
            multiPlayerMode = true;
            dataLoaded = true;
            syncToAppState();
            EventBus.emit('data:loaded', { questions: questions.length, users: users.length, source: 'folder' });

            // UI aktualisieren
            updateFolderStatus(playerFiles.length, Object.keys(playersByName).length, loadedQuestionFiles);

            document.getElementById('quizTitle').textContent = quizSettings.quizName || 'XY Quiz';
            const et = document.getElementById('encryptToggle');
            if (et) { et.checked = !!quizSettings.encryptPlayerData; document.getElementById('encryptHint').textContent = quizSettings.encryptPlayerData ? 'Base64-kodiert (alle Dateien)' : 'Klartext'; }

            renderUserSelect();
            renderLeaderboard();
            updateQuestionsList();
            updateUsersList();

            // Ordner-Anzeige
            document.getElementById('modeFolder').textContent = loadedFolderName;
            document.getElementById('modeOperatorCount').textContent = users.length;

            // Duplikate anzeigen
            let dupNames = [];
            let dupTotal = 0;
            loadedPlayerFiles.forEach(function(pf) {
                if (pf.totalFiles > 1) {
                    dupNames.push(pf.playerName + '(' + pf.totalFiles + ')');
                    dupTotal += pf.totalFiles - 1;
                }
            });
            let dupEl = document.getElementById('modeDuplicates');
            if (dupEl) {
                if (dupTotal > 0) {
                    dupEl.textContent = 'Duplicates: ' + dupTotal + ' (' + dupNames.join(', ') + ')';
                    dupEl.style.color = 'var(--incorrect)';
                } else {
                    dupEl.textContent = 'Duplicates: 0';
                }
            }

            showScreen('startScreen');

            event.target.value = ''; // Reset input
          } catch(err) {
            console.error('Ordner-Laden Fehler:', err);
            GameDialog.showError('Fehler beim Laden des Ordners', err.message + '\n\nStack:\n' + (err.stack || '').split('\n').slice(0,5).join('\n'));
          }
        }

        function saveCurrentPlayer() {
            if (!currentUser) {
                Toast.show('Bitte zuerst einen Spieler auswählen.', 'warning');
                return;
            }

            // Format: 04_operator_NAME_YYYY-MM-DD_HHMM-SS.json
            const now = new Date();
            const timestamp = now.toISOString().slice(0, 19).replace('T', '_').replace(/:/g, '');
            const playerName = currentUser.name.toUpperCase().replace(/\s+/g, '-').replace(/[^A-Z0-9-]/g, '');
            const fileName = `04_operator_${playerName}_${timestamp}.json`;

            let dataStr = JSON.stringify(currentUser, null, 2);
            if (quizSettings.encryptPlayerData) {
                try { dataStr = btoa(unescape(encodeURIComponent(dataStr))); } catch(e) { console.error('Encoding error:', e); }
            }
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            Toast.show(`Spielerdaten gespeichert als:\n${fileName}\n\nBitte speichern Sie die Datei im Quiz-Ordner!`, 'success');
        }

        function importLegacyFile(event) {

                    // Prüfen ob verschlüsselt
                    try {
                        importedData = JSON.parse(content);
                    } catch(e1) {
                        // Versuche zu entschlüsseln
                        const decoded = decodeURIComponent(escape(atob(content)));
                        const jsonStr = decoded.substring(0, decoded.length - encryptionKey.length);
                        importedData = JSON.parse(jsonStr);
                    }

                    // Daten übernehmen
                    if (importedData.questions) {
                        questions = importedData.questions;
                        // _fileGroup aus theme setzen falls nicht vorhanden

            }

            function checkPassword(event) {
                event.preventDefault();
                const input   = document.getElementById('forgePasswordInput');
                const error   = document.getElementById('forgePasswordError');
                const entered = input ? input.value : '';
                const pw      = (typeof quizSettings !== 'undefined') ? (quizSettings.adminPassword || '') : '';

                if (entered === pw) {

                }

                _panels.push({ id, label, icon, renderFn });
            }

            function registerSeparator() {
                _panels.push({ type: 'separator' });
            }

            function _renderPanel(id) {
                const p     = _panels.find(p => p.id === id);
                const panel = document.getElementById('adminPanel_' + id);
                if (!p || !panel) return;
                panel.innerHTML = '';
                try { p.renderFn(panel); }
                catch (e) {
                    panel.innerHTML = `<div class="card" style="color:var(--incorrect)">Fehler beim Laden: ${e.message}</div>`;
                }
            }

            function showPanel(id) {
                document.querySelectorAll('.admin-panel').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.admin-nav-item').forEach(el => el.classList.remove('active'));
                const panel  = document.getElementById('adminPanel_' + id);
                const navBtn = document.getElementById('adminNav_' + id);
                if (panel)  panel.classList.add('active');
                if (navBtn) navBtn.classList.add('active');
                _renderPanel(id);
            }

            function _buildNav() {
                const nav     = document.getElementById('adminNav');
                const content = document.getElementById('adminContent');
                if (!nav || !content) return;

                if (_panels.length === 0) {
                    content.innerHTML = `
                        <div class="admin-empty">
                            <div class="admin-empty-icon">🔧</div>
                            <div>Keine Module geladen</div>
                        </div>`;
                    return;
                }

                nav.innerHTML     = '';
                content.innerHTML = '';

                _panels.forEach(p => {
                    if (p.type === 'separator') {
                        const sep = document.createElement('div');
                        sep.style.cssText = 'height:20px;flex-shrink:0';
                        nav.appendChild(sep);
                        return;
                    }

                    const btn = document.createElement('button');
                    btn.className = 'admin-nav-item';
                    btn.id        = 'adminNav_' + p.id;
                    btn.innerHTML = `<span>${p.icon}</span><span>${p.label}</span>`;
                    btn.onclick   = () => showPanel(p.id);
                    nav.appendChild(btn);

                    const panel   = document.createElement('div');
                    panel.className = 'admin-panel';
                    panel.id        = 'adminPanel_' + p.id;
                    content.appendChild(panel);
                });

                if (_panels[0]) showPanel(_panels[0].id);
            }

            document.addEventListener('DOMContentLoaded', _buildNav);

            return { registerPanel, registerSeparator, showPanel, unlock, checkPassword };
        })();

        async function _adminLoadFolder(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            loadedFolderName = files[0].webkitRelativePath.split('/')[0];

            // Alle JSON-Dateien lesen
            const results = await Promise.all(
                files
                    .filter(f => f.name.endsWith('.json'))
                    .map(f => new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = e => {
                            try {
                                let raw = e.target.result;
                                let data;
                                try { data = JSON.parse(raw); }
                                catch { data = JSON.parse(decodeURIComponent(escape(atob(raw.trim())))); }
                                resolve({ name: f.name, data, lastModified: f.lastModified });
                            } catch { resolve(null); }
                        };
                        reader.onerror = () => resolve(null);
                        reader.readAsText(f);
                    }))
            );

            const valid = results.filter(Boolean);

            const masterFiles  = valid.filter(r => /^02_(quiz-master|QUIZ-MASTER)/i.test(r.name));
            const playerFiles  = valid.filter(r => /^04_(operator|Operator)_/i.test(r.name));
            const questionFiles = valid.filter(r => /^03_(questions|Questions)_/i.test(r.name));

            // Settings aus neuester Master-Datei
            if (masterFiles.length) {
                masterFiles.sort((a, b) => b.lastModified - a.lastModified);
                const master = masterFiles[0].data;
                quizSettings = ensureSettingsDefaults(Object.assign({}, quizSettings, master.settings || {}));
            }

            // Fragen laden
            questions = [];
            loadedQuestionFiles = [];
            questionFiles.forEach(qf => {
                const fileTheme = qf.data.theme || '';
                const qList = qf.data.questions || [];
                let loaded = 0;
                qList.forEach((q, qi) => {
                    try {
                        const n = normalizeQuestion(q);
                        const isDupe = questions.some(eq =>
                            (n.questionId && eq.questionId === n.questionId) ||
                            (eq.text || '').trim().toLowerCase() === (n.text || '').trim().toLowerCase()
                        );
                        if (isDupe) return;
                        n.id = Date.now() + questions.length + qi;
                        n.sourceFile = qf.name;
                        // _fileGroup: Frage selbst → Datei-Theme → 'Manuell'
                        if (!n._fileGroup) n._fileGroup = fileTheme || 'Manuell';
                        questions.push(n);
                        loaded++;
                    } catch { /* fehlerhafte Frage überspringen */ }
                });
                loadedQuestionFiles.push({ name: qf.name, theme: fileTheme || 'Unbekannt', count: loaded });
            });

            // Spieler laden (neueste Version pro Name)
            users = [];
            loadedPlayerFiles = [];
            const byName = {};
            playerFiles.forEach(pf => {
                if (!pf.data || !pf.data.name) return;
                if (!byName[pf.data.name] || pf.lastModified > byName[pf.data.name].lastModified)
                    byName[pf.data.name] = pf;
            });
            Object.values(byName).forEach(pf => {
                users.push(pf.data);
                loadedPlayerFiles.push({ name: pf.name, playerName: pf.data.name });
            });

            dataLoaded = true;
            syncToAppState();

            event.target.value = '';

            Toast.show(`✅ Geladen: ${users.length} Spieler, ${questions.length} Fragen`, 'success');

            // Passwort prüfen → Tabs freischalten (oder direkt wenn leer)
            AdminShell.unlock();
        }

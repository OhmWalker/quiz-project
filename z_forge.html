<!-- Forge — Single File · 100% Offline · No localStorage -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge</title>
    <style>
        /* === Passwort-Modal (nach Datei-Load, wenn Passwort gesetzt) === */
        .forge-pw-modal {
            position: fixed;
            inset: 0;
            background: var(--shadow-70);
            z-index: 9000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .forge-pw-card {
            background: var(--bg-light);
            border: 1px solid var(--overlay-15);
            border-radius: 20px;
            padding: 40px;
            width: 340px;
            box-shadow: 0 20px 60px var(--shadow-50);
            text-align: center;
        }

        .forge-pw-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .forge-pw-error {
            color: var(--incorrect);
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 18px;
            display: none;
        }

        .forge-pw-error.active { display: block; }

        /* === Admin-Layout === */
        .admin-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .admin-nav {
            width: 190px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
        }

        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            background: var(--overlay-5);
            border: 1px solid var(--overlay-10);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            margin-bottom: 5px;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-nav-item:hover { background: var(--overlay-10); }

        .admin-nav-item.active {
            background: var(--overlay-12);
            border-color: var(--primary);
            color: var(--primary);
        }

        .admin-content { flex: 1; min-width: 0; }

        .admin-panel { display: none; }

        .admin-panel.active {
            display: block;
            animation: adminFadeIn 0.25s ease-out;
        }

        @keyframes adminFadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .admin-empty {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.4;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .admin-empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    </style>
    <style>
        /* === 00-base.css === */
        /* 00-base.css - Reset, Variables, Typography, Core Components */



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #F7B801;
            --bg-dark: #1A1A2E;
            --bg-light: #16213E;
            --text: #EAEAEA;
            --correct: #2ECC71;
            --incorrect: #E74C3C;

            /* White overlays */
            --overlay-5: rgba(255, 255, 255, 0.05);
            --overlay-8: rgba(255, 255, 255, 0.08);
            --overlay-10: rgba(255, 255, 255, 0.1);
            --overlay-12: rgba(255, 255, 255, 0.12);
            --overlay-15: rgba(255, 255, 255, 0.15);
            --overlay-20: rgba(255, 255, 255, 0.2);
            --overlay-30: rgba(255, 255, 255, 0.3);

            /* Black shadows */
            --shadow-30: rgba(0, 0, 0, 0.3);
            --shadow-40: rgba(0, 0, 0, 0.4);
            --shadow-50: rgba(0, 0, 0, 0.5);
            --shadow-70: rgba(0, 0, 0, 0.7);
        }


        .hidden { display: none !important; }

        /* Info tables */
        .info-table { width: 100%; border-collapse: collapse; margin: 10px 0 20px; }
        .info-table-sm { width: 100%; border-collapse: collapse; margin: 10px 0 15px; font-size: 0.9rem; }
        .info-table tr,
        .info-table-sm tr { border-bottom: 1px solid rgba(255,255,255,0.15); }
        .info-table-sm tr { border-bottom-color: rgba(255,255,255,0.1); }
        .info-table td,
        .info-table-sm td { padding: 8px; }
        .info-table-sm td { padding: 5px; }
        .td-bold { font-weight: 700; }
        .td-muted { opacity: 0.6; }
        .td-nowrap { white-space: nowrap; }

        /* Section headings & titles */
        .section-heading { color: var(--accent); margin: 20px 0 10px; }
        .section-title { margin: 30px 0 20px 0; font-size: 1.5rem; }

        /* Code inline tags */
        .code-tag { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; }

        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; font-size: 0.88rem; line-height: 1.7; margin: 5px 0 10px 0; }

        /* Radio/checkbox option rows */
        .radio-option { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; }

        /* Common utilities */
        .mb-20 { margin-bottom: 20px; }
        .mt-15 { margin-top: 15px; }
        .mt-30 { margin-top: 30px; }
        .text-muted { font-size: 0.85rem; opacity: 0.7; }


        body {
            font-family: 'Courier New', Courier, monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 78, 137, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }


        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin: 0 0 6px 0;
            animation: fadeInDown 0.6s ease-out;
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            padding: 12px 16px 16px 16px;
            margin-left: calc(-50vw + 50%);
            width: 100vw;
            box-shadow: 0 5px 20px var(--shadow-50);
        }

        h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 2.88rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            letter-spacing: -2px;
        }

        .subtitle {
            color: var(--text);
            opacity: 0.7;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }


        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }


        .card {
            background: var(--overlay-5);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 60px var(--shadow-30);
            border: 1px solid var(--overlay-10);
            margin-bottom: 27px;
        }


        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 14.4px 36px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #006BA6);
            box-shadow: 0 10px 30px rgba(0, 78, 137, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 15px 40px rgba(0, 78, 137, 0.4);
        }

        .btn-small {
            padding: 10px 24px;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--overlay-8);
            border: 2px solid var(--overlay-10);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--overlay-12);
        }

        select option {
            background: #1A1A2E;
            color: #EAEAEA;
        }

        label {
            display: block;
            margin: 20px 0 5px 0;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }


        /* === 01-screens.css === */
        /* 01-screens.css - User Selection, Quiz, Results, Admin Nav */

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--correct), #27AE60);
            color: white;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
        }
        .user-select {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 30px 0;
        }


        .user-select .last-row-spacer {
            display: none;
        }

        @media (max-width: 1200px) {
            .user-select {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 900px) {
            .user-select {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .user-select {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .user-card {
            background: var(--overlay-8);
            padding: 15.75px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            border: 2px solid var(--overlay-10);
            text-align: center;
            position: relative;
            overflow: hidden;
        }


        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: var(--xp-progress, 0%);
            border: 2px solid #FF5F15;
            border-right: none;
            border-radius: 15px 0 0 15px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .user-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: var(--xp-progress, 0%);
            height: 100%;
            width: calc(100% - var(--xp-progress, 0%));
            border: 2px solid var(--overlay-10);
            border-left: none;
            border-radius: 0 15px 15px 0;
            box-sizing: border-box;
            pointer-events: none;
        }

        .user-card:hover {
            background: var(--overlay-12);
            transform: translateY(-5px);
        }

        .user-card.selected {
            background: rgba(247, 184, 1, 0.15);
        }

        .user-card.selected::before {
            border-color: var(--accent);
        }

        .user-card.selected::after {
            border-color: var(--accent);
            opacity: 0.5;
        }

        .user-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
            border: 2px solid;
            position: relative;
            overflow: hidden;
        }

        .user-avatar::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .user-info {
            flex: 1;
            text-align: left;
        }

        .user-name {
            font-size: 0.91rem;
            font-weight: 700;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-level {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: var(--bg-dark);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .user-xp-container {
            margin-top: 5px;
        }

        .user-xp-bar {
            height: 6px;
            background: var(--overlay-10);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .user-xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }

        .user-xp-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, transparent, var(--overlay-30), transparent);
            transform: translateX(-100%);
        }

        .user-card:hover .user-xp-fill::after {
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .user-xp-text {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-top: 3px;
        }

        .user-stats {
            font-size: 0.63rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .question-container {
            margin: 40px 0;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--overlay-10);
            gap: 10px;
            flex-wrap: nowrap;
        }

        .question-number {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
        }


        .imagemap-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            border: 2px solid rgba(255,255,255,0.15);
            touch-action: none;
        }
        .imagemap-container img {
            width: 100%;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
        .imagemap-marker {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.4);
        }
        .imagemap-marker.player { background: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.4), 0 0 15px rgba(52,152,219,0.5); }
        .imagemap-marker.correct { background: #2ecc71; box-shadow: 0 0 0 3px rgba(46,204,113,0.4), 0 0 15px rgba(46,204,113,0.5); }
        .imagemap-marker.incorrect { background: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,0.4), 0 0 15px rgba(231,76,60,0.5); }
        .imagemap-marker.pulse { animation: markerPulse 1.5s infinite; }
        @keyframes markerPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }
        .imagemap-zone-overlay {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        .imagemap-scroll-wrapper {
            border-radius: 12px;
        }

        .imagemap-editor {
            position: relative;
            border: 2px dashed var(--accent);
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            margin: 15px 0;
            max-height: 75vh;
        }
        .imagemap-editor img {
            width: 100%;
            display: block;
            user-select: none;
        }
        .imagemap-editor-point {
            position: absolute;
            width: 16px; height: 16px;
            background: #e74c3c;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: move;
            z-index: 20;
            font-size: 0.6rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }
        .imagemap-editor-radius {
            position: absolute;
            border: 1.5px dashed rgba(46,204,113,0.7);
            border-radius: 50%;
            background: rgba(46,204,113,0.12);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 15;
        }

        .quiz-xp-counter {
            font-size: 1rem;
            font-weight: 700;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(46, 204, 113, 0.25);
            transition: all 0.3s ease;
        }
        .quiz-xp-counter.xp-bump {
            transform: scale(1.15);
            color: #f1c40f;
            background: rgba(241, 196, 0, 0.15);
            border-color: rgba(241, 196, 0, 0.35);
        }

        .question-text {
            font-size: 1.62rem;
            font-weight: 700;
            margin: 27px 0;
            line-height: 1.4;
        }

        .question-media {
            margin: 30px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px var(--shadow-30);
            width: var(--quiz-img-width, 80%);
            max-width: 100%;
        }

        .question-media img,
        .question-media video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }

        .answer-btn {
            background: var(--overlay-8);
            border: 2px solid var(--overlay-20);
            color: var(--text);
            padding: 20px 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
            z-index: -1;
        }

        .answer-btn:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .answer-btn:hover::before {
            width: 100%;
        }

        .answer-btn.selected {
            border-color: var(--accent);
            background: rgba(247, 184, 1, 0.2);
        }

        .answer-btn.correct {
            border-color: var(--correct);
            background: rgba(46, 204, 113, 0.2);
        }

        .answer-btn.incorrect {
            border-color: var(--incorrect);
            background: rgba(231, 76, 60, 0.2);
        }

        .text-answer-input.correct  { background: rgba(46, 204, 113, 0.2); border-color: var(--correct); }
        .text-answer-input.incorrect { background: rgba(231, 76, 60, 0.2);  border-color: var(--incorrect); }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }





        .answer-checkbox-container {
            background: var(--overlay-8);
            border: 2px solid var(--overlay-20);
            padding: 14px 16px;
            border-radius: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            cursor: pointer;  
            position: relative;
            display: flex;
            align-items: center;
            min-height: 22px;
        }


        .answer-checkbox-container:hover {
            background: var(--overlay-12);
            border-color: var(--primary);
            transform: translateX(5px);  
        }


        .answer-checkbox-container.correct {
            border-color: var(--correct);
            background: rgba(46, 204, 113, 0.2);
        }


        .answer-checkbox-container.incorrect {
            border-color: var(--incorrect);
            background: rgba(231, 76, 60, 0.2);
        }


        .answer-checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;  
            width: 100%;  
        }


        .answer-checkbox {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }


        .answer-checkbox-custom {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            margin-right: 14px;
            background: var(--overlay-10);
            border: 2px solid var(--overlay-30);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            font-family: monospace;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }


        .answer-checkbox-container:hover .answer-checkbox-custom {
            border-color: var(--primary);
            color: var(--primary);
        }


        .answer-checkbox:checked + .answer-checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }


        .answer-checkbox:disabled + .answer-checkbox-custom {
            cursor: not-allowed;
            opacity: 0.6;
        }


        .answer-checkbox-container.correct .answer-checkbox-custom {
            background: var(--correct);
            border-color: var(--correct);
            color: #fff;
        }

        function getCorrectTextAnswers(q) {
            // 1. Kanonisches Format (nach normalizeQuestion)
            if (q.answers && q.answers[0] && Array.isArray(q.answers[0].correctAnswers)) {
                return q.answers[0].correctAnswers;

            // 2. correctAnswer als Array
            const ca = q.correctAnswer;
            if (Array.isArray(ca)) return ca;

        // TOAST — Einheitliches Benachrichtigungs-System


        const Toast = {
            _container: null,
    
            _ensureContainer() {
                if (!this._container) {
                    this._container = document.createElement('div');
                    this._container.id = 'toastContainer';
                    this._container.style.cssText = 'position:fixed;top:20px;right:20px;z-index:100000;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
                    document.body.appendChild(this._container);
                }
                return this._container;
            },
    
    
            show(message, type = 'info', duration = CONFIG.UI.TOAST_DURATION_MS) {
                const container = this._ensureContainer();
                const toast = document.createElement('div');
                const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
                const colors = { 
                    info: 'rgba(52,152,219,0.95)', 
                    success: 'rgba(46,204,113,0.95)', 
                    warning: 'rgba(241,196,15,0.95)', 
                    error: 'rgba(231,76,60,0.95)' 
                };
                toast.style.cssText = `background:${colors[type] || colors.info};color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;pointer-events:auto;cursor:pointer;opacity:0;transform:translateX(100%);transition:all ${CONFIG.UI.TOAST_FADE_MS}ms ease;max-width:350px;box-shadow:0 4px 15px rgba(0,0,0,0.3);`;
                toast.textContent = `${icons[type] || ''} ${message}`;
                toast.onclick = () => this._remove(toast);
                container.appendChild(toast);
        
                requestAnimationFrame(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateX(0)';
                });
        
                if (duration > 0) {
                    setTimeout(() => this._remove(toast), duration);
                }
                return toast;
            },
    
            _remove(toast) {
                if (toast._removing) return;
                toast._removing = true;
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), CONFIG.UI.TOAST_FADE_MS);
            }
        };

        // === 03-eventbus.js ===
        // 03-eventbus.js
        // EventBus publish/subscribe system
        // ============================================================

        // EVENT BUS — Publish/Subscribe für Plugin-Kommunikation


        const EventBus = {
            // Event Catalog — Dokumentation aller Events im System
            EVENTS: {
                DATA_LOADED:          'data:loaded',           // { questions, users, source }
                USER_SELECTED:        'user:selected',         // { user }
                QUIZ_STARTED:         'quiz:started',          // { user, questionCount }
                QUIZ_QUESTION:        'quiz:questionDisplayed', // { index, question }
                QUIZ_ANSWER:          'quiz:answerSubmitted',  // { questionId, correct, xp }
                QUIZ_COMPLETED:       'quiz:completed',        // { user, correct, total, xp, pct }
                QUIZ_RESTARTED:       'quiz:restarted',        // {}
                QUIZ_ABANDONED:       'quiz:abandoned',        // { xp }
                ABILITY_USED:         'ability:used',          // { ability, user }
                PLUGINS_INITIALIZED:  'plugins:initialized',   // { count }
                PLUGIN_ENABLED:       'plugin:enabled',        // { name }
                PLUGIN_DISABLED:      'plugin:disabled',       // { name }
            },

            _listeners: {},
    
    
            on(event, callback, context) {
                if (!this._listeners[event]) this._listeners[event] = [];
                const entry = { fn: callback, ctx: context || 'anonymous' };
                this._listeners[event].push(entry);
                // Rückgabe: Unsubscribe-Funktion
                return () => {
                    this._listeners[event] = this._listeners[event].filter(e => e !== entry);
                };
            },
    
    
            once(event, callback, context) {
                const wrapper = (...args) => {
                    unsub();
                    callback(...args);
                };
                wrapper._originalCallback = callback;
                const unsub = this.on(event, wrapper, context);
                return unsub;
            },
    
    
            emit(event, data) {
                const listeners = this._listeners[event];
                if (!listeners || listeners.length === 0) return;
        
                for (const entry of listeners) {
                    try {
                        entry.fn(data);
                    } catch (err) {
                        console.error(`[EventBus] Error in "${event}" handler (${entry.ctx}):`, err);
                    }
                }
            },
    
    
            off(event, callback) {
                if (!callback) {
                    delete this._listeners[event];
                } else if (this._listeners[event]) {
                    this._listeners[event] = this._listeners[event].filter(e =>
                        e.fn !== callback && e.fn._originalCallback !== callback
                    );
                }
            },
    
    
            debug() {
                console.group('[EventBus] Registered Events');
                for (const [event, listeners] of Object.entries(this._listeners)) {
                    console.log(`  ${event}: ${listeners.length} listener(s) [${listeners.map(l => l.ctx).join(', ')}]`);
                }
                console.groupEnd();
            }
        };

        // === 06-plugin-registry.js ===
        // 06-plugin-registry.js
        // PluginRegistry plugin management
        // ============================================================

        // PLUGIN REGISTRY — Plugin-Verwaltung


        const PluginRegistry = {
            _plugins: {},
            _initOrder: [],
    
    
            register(name, plugin, options = {}) {
                if (this._plugins[name]) {
                    console.warn(`[PluginRegistry] Plugin "${name}" ist bereits registriert.`);
                    return;
                }
        
                this._plugins[name] = {
                    instance: plugin,
                    name,
                    enabled: true,
                    initialized: false,
                    category: options.category || 'feature',
                    description: options.description || '',
                    dependencies: options.dependencies || [],
                    required: options.required || false
                };
        
                this._initOrder.push(name);
                console.log(`[PluginRegistry] Plugin "${name}" registriert (${options.category || 'feature'})`);
            },
    
    
            initAll() {
                console.group('[PluginRegistry] Initialisiere Plugins...');
                for (const name of this._initOrder) {
                    this._initPlugin(name);
                }
                console.groupEnd();
                EventBus.emit('plugins:initialized', { count: this._initOrder.length });
            },
    
            _initStack: new Set(),

            _initPlugin(name) {
                const entry = this._plugins[name];
                if (!entry || entry.initialized) return;

                // Zirkuläre Abhängigkeit erkennen
                if (this._initStack.has(name)) {
                    const chain = [...this._initStack, name].join(' → ');
                    console.error(`[PluginRegistry] Zirkuläre Abhängigkeit erkannt: ${chain}`);
                    return;
                }
                this._initStack.add(name);

                // Abhängigkeiten zuerst
                for (const dep of entry.dependencies) {
                    if (!this._plugins[dep]) {
                        console.error(`[PluginRegistry] Plugin "${name}" benötigt "${dep}", aber es ist nicht registriert!`);
                        this._initStack.delete(name);
                        return;
                    }
                    this._initPlugin(dep);
                }
        
                try {
                    if (typeof entry.instance.init === 'function') {
                        entry.instance.init();
                    }
                    entry.initialized = true;
                    console.log(`  ✅ ${name}`);
                } catch (err) {
                    console.error(`  ❌ ${name}:`, err);
                }
                this._initStack.delete(name);
            },
    
    
            get(name) {
                const entry = this._plugins[name];
                return entry ? entry.instance : null;
            },
    
    
            isEnabled(name) {
                const entry = this._plugins[name];
                return entry ? entry.enabled : false;
            },
    
    
            enable(name) {
                const entry = this._plugins[name];
                if (!entry) return false;
        
                entry.enabled = true;
                if (typeof entry.instance.enable === 'function') {
                    entry.instance.enable();
                }

                if (typeof PLUGIN_SETTINGS_MAP !== 'undefined') {
                    const settingsKey = PLUGIN_SETTINGS_MAP[name];
                    if (settingsKey && typeof getMG === 'function') {
                        const mg = getMG();
                        if (mg[settingsKey]) mg[settingsKey].enabled = true;
                    }
                }
        
                EventBus.emit('plugin:enabled', { name });
                console.log(`[PluginRegistry] Plugin "${name}" aktiviert`);
                return true;
            },
    
    
            disable(name) {
                const entry = this._plugins[name];
                if (!entry || entry.required) return false;
        
                entry.enabled = false;
                if (typeof entry.instance.disable === 'function') {
                    entry.instance.disable();
                }

                if (typeof PLUGIN_SETTINGS_MAP !== 'undefined') {
                    const settingsKey = PLUGIN_SETTINGS_MAP[name];
                    if (settingsKey && typeof getMG === 'function') {
                        const mg = getMG();
                        if (mg[settingsKey]) mg[settingsKey].enabled = false;
                    }
                }

                for (const [depName, depEntry] of Object.entries(this._plugins)) {
                    if (depEntry.enabled && depEntry.dependencies && depEntry.dependencies.includes(name)) {
                        console.warn(`[PluginRegistry] Warnung: "${depName}" hängt von "${name}" ab und ist noch aktiv.`);
                    }
                }
        
                EventBus.emit('plugin:disabled', { name });
                console.log(`[PluginRegistry] Plugin "${name}" deaktiviert`);
                return true;
            },
    
    
            getAll() {
                return Object.values(this._plugins).map(p => ({
                    name: p.name,
                    enabled: p.enabled,
                    initialized: p.initialized,
                    category: p.category,
                    description: p.description,
                    required: p.required
                }));
            },
    
    
            getConfig() {
                const config = {};
                for (const [name, entry] of Object.entries(this._plugins)) {
                    config[name] = { enabled: entry.enabled };
                    if (typeof entry.instance.getConfig === 'function') {
                        config[name].settings = entry.instance.getConfig();
                    }
                }
                return config;
            },
    
    
            loadConfig(config) {
                if (!config) return;
                for (const [name, cfg] of Object.entries(config)) {
                    const entry = this._plugins[name];
                    if (!entry) continue;
            
                    // Enable/Disable über die offiziellen Methoden,
                    // damit Plugin-eigene enable()/disable()-Hooks feuern
                    if (cfg.enabled === false && !entry.required) {
                        this.disable(name);
                    } else if (cfg.enabled === true && !entry.enabled) {
                        this.enable(name);
                    }
            
                    if (cfg.settings && typeof entry.instance.loadConfig === 'function') {
                        entry.instance.loadConfig(cfg.settings);
                    }
                }
            }
        };

        // === 07-event-delegation.js ===
        // 07-event-delegation.js
        // Event delegation system - replaces inline onclick/onchange handlers
        // ============================================================

        // EVENT DELEGATION — Ersetzt inline onclick/onchange durch data-Attribute
        //
        // Nutzung in HTML:
        //   <button data-action="startQuiz" data-plugin="ClassicQuizPlugin">Start</button>
        //   <button data-action="showAdminSection" data-args='["settings"]'>Settings</button>
        //   <input data-change="handleSlider" data-args='["volume"]'>
        //
        // data-action:  Methodenname (click)
        // data-change:  Methodenname (change/input)
        // data-plugin:  Optional — Plugin-Name (via PluginRegistry)
        // data-args:    Optional — JSON-Array mit Argumenten

        const EventDelegation = {

            init() {
                // Click-Events
                document.body.addEventListener('click', (e) => {
                    // data-trigger: Klick auf anderes Element weiterleiten (z.B. File-Inputs)
                    const trigger = e.target.closest('[data-trigger]');
                    if (trigger) {
                        const target = document.getElementById(trigger.dataset.trigger);
                        if (target) target.click();
                        return;
                    }
                    // data-toggle-overlay: Overlay ein-/ausblenden
                    const toggle = e.target.closest('[data-toggle-overlay]');
                    if (toggle) {
                        const overlay = document.getElementById(toggle.dataset.toggleOverlay);
                        if (!overlay) return;
                        const show = toggle.dataset.overlayShow !== 'false';
                        if (show) {
                            overlay.classList.add('active');
                            document.body.style.overflow = 'hidden';
                        } else {
                            overlay.classList.remove('active');
                            document.body.style.overflow = '';
                        }
                        return;
                    }
                    // data-action: Standard-Handler
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    e.preventDefault();
                    this._dispatch(target.dataset.action, target.dataset.plugin, target.dataset.args, e, target);
                });

                // Change-Events (select, checkbox, file inputs)
                document.body.addEventListener('change', (e) => {
                    const target = e.target.closest('[data-change]');
                    if (!target) return;
                    this._dispatch(target.dataset.change, target.dataset.plugin, target.dataset.args, e, target);
                });

                // Input-Events (range sliders, text inputs)
                document.body.addEventListener('input', (e) => {
                    const target = e.target.closest('[data-input]');
                    if (!target) return;
                    this._dispatch(target.dataset.input, target.dataset.plugin, target.dataset.args, e, target);
                });

                // Submit-Events (forms)
                document.body.addEventListener('submit', (e) => {
                    const target = e.target.closest('[data-submit]');
                    if (!target) return;
                    e.preventDefault();
                    this._dispatch(target.dataset.submit, target.dataset.plugin, target.dataset.args, e, target);
                });
            },

            _dispatch(action, pluginName, argsJson, event, element) {
                const args = argsJson ? JSON.parse(argsJson) : [];

                // Plugin-Methode aufrufen
                if (pluginName) {
                    const plugin = PluginRegistry.get(pluginName);
                    if (!plugin) {
                        console.warn('[EventDelegation] Plugin not found:', pluginName);
                        return;
                    }
                    if (!PluginRegistry.isEnabled(pluginName)) return;
                    if (typeof plugin[action] === 'function') {
                        return plugin[action](...args, event, element);
                    }
                    console.warn('[EventDelegation] Method not found:', pluginName + '.' + action);
                    return;
                }

                // Globale Funktion aufrufen
                if (typeof window[action] === 'function') {
                    return window[action](...args, event, element);
                }

                console.warn('[EventDelegation] Handler not found:', action);
            }
        };

                // Fähigkeiten-Badges (10)
                jokermeister:{id:'jokermeister',name:'Joker-Meister',emoji:'🃏',cat:'faehigkeit',desc:'50:50 genutzt',stat:'ab_fiftyFifty',thresholds:[3,10,30,100,300]},
                telefonmeister:{id:'telefonmeister',name:'Telefonmeister',emoji:'📞',cat:'faehigkeit',desc:'Telefon-Joker genutzt',stat:'ab_phoneJoker',thresholds:[3,10,30,100,300]},

                verteidiger:{id:'verteidiger',name:'Verteidiger',emoji:'🛡️',cat:'faehigkeit',desc:'Schild genutzt',stat:'ab_shield',thresholds:[3,10,30,100,300]},
                alleskoenner:{id:'alleskoenner',name:'Alleskönner',emoji:'🌈',cat:'faehigkeit',desc:'Versch. Fähigk. genutzt',stat:'uniqueAbilities',thresholds:[2,4,6,8,10]},
                // Mini-Game-Badges (10)
                glueckspilz:{id:'glueckspilz',name:'Glückspilz',emoji:'🍀',cat:'minigame',desc:'Spinner gespielt',stat:'spinnerPlays',thresholds:[3,10,30,100,300]},
                jackpot:{id:'jackpot',name:'Jackpot',emoji:'💎',cat:'minigame',desc:'Jackpot gewonnen',stat:'jackpots',thresholds:[1,5,15,50,150]},
                drachentoeter:{id:'drachentoeter',name:'Drachentöter',emoji:'🐉',cat:'minigame',desc:'Bosse besiegt',stat:'bossKills',thresholds:[1,5,15,50,150]},
                ueberlebender:{id:'ueberlebender',name:'Überlebender',emoji:'❤️',cat:'minigame',desc:'Boss-Kämpfe',stat:'bossAttempts',thresholds:[3,10,30,100,300]},
                spieler:{id:'spieler',name:'Spieler',emoji:'🎲',cat:'minigame',desc:'Mini-Games gesamt',stat:'totalMiniGames',thresholds:[10,30,100,300,1000]},

            },
            TIER_COLORS:['gray','green','blue','purple','gold'],
            TIER_ICONS:['⚪','🟢','🔵','🟣','🥇'],

            init() {
                this._initSidebarDrag();
                EventBus.on(EventBus.EVENTS.USER_SELECTED, (data) => {
                    this.renderSidebars(data.user);
                }, 'BadgePlugin');
                EventBus.on(EventBus.EVENTS.QUIZ_STARTED, () => {
                    this.hideSidebars();
                }, 'BadgePlugin');
                EventBus.on(EventBus.EVENTS.QUIZ_COMPLETED, () => {
                    if (currentUser) this.checkBadges(currentUser);
                }, 'BadgePlugin');
            },

            checkBadges(user) {
                if (!user || !PluginRegistry.isEnabled('BadgePlugin')) return;
                const defs = this.getBadgeDefinitions();
                const stats = this.calculateBadgeStats(user);
                if (!user._badgeTiers) user._badgeTiers = {};
                Object.values(defs).forEach(b => {
                    if (b.active === false) return;
                    const val = stats[b.stat] || 0;
                    const tier = this.getBadgeTier(val, b.thresholds, b.inverted);
                    const prev = user._badgeTiers[b.id] || 0;
                    if (tier > prev) {
                        user._badgeTiers[b.id] = tier;
                        Toast.show(`${b.customIcon || b.emoji} ${b.name} ${this.TIER_ICONS[tier-1]} erreicht!`, 'success');
                    }
                });
                this.renderSidebars(user);
            },

            getBadgeDefinitions() {
                const defs = JSON.parse(JSON.stringify(this.DEFAULT_BADGES));
                const overrides = quizSettings.badges || {};
                Object.keys(overrides).forEach(id => {
                    if (defs[id]) Object.assign(defs[id], overrides[id]);
                });
                return defs;
            },

            calculateBadgeStats(user) {
                if (!user) return {};
                const bs = user.badgeStats || {};
                const qs = user.questionStats || {};
                const hist = user.history || [];
                const stats = { ...bs };
                stats.totalXP = user.totalXP || 0;
                stats.level = user.level || 1;
                // Unique days
                const days = new Set(hist.map(h => new Date(h.date).toDateString()));
                stats.uniqueDays = days.size;
                // First day quizzes
                if (hist.length > 0) {
                    const firstDay = new Date(hist[0].date).toDateString();
                    stats.firstDayQuizzes = hist.filter(h => new Date(h.date).toDateString() === firstDay).length;
                }
                // Unique questions
                stats.uniqueQuestions = Object.keys(qs).length;
                // Mastered questions (3+ correct)
                stats.masteredQuestions = Object.values(qs).filter(s => (s.correct || 0) >= 3).length;
                // Active weeks
                const weeks = new Set(hist.map(h => {
                    const d = new Date(h.date);
                    const yr = d.getFullYear();
                    const wk = Math.ceil(((d - new Date(yr, 0, 1)) / 86400000 + new Date(yr, 0, 1).getDay() + 1) / 7);
                    return `${yr}-W${wk}`;
                }));
                stats.activeWeeks = weeks.size;
                // Improvements (better than last quiz)
                let improvements = 0;
                for (let i = 1; i < hist.length; i++) {
                    if ((hist[i].score || 0) > (hist[i-1].score || 0)) improvements++;
                }
                stats.improvements = improvements;
                // Comebacks (quiz after 7+ day gap)
                let comebacks = 0;
                for (let i = 1; i < hist.length; i++) {
                    const gap = (new Date(hist[i].date) - new Date(hist[i-1].date)) / 86400000;
                    if (gap >= 7) comebacks++;
                }
                stats.comebacks = comebacks;
                // Marathon days (10+ quizzes in a day)
                const dayCounts = {};
                hist.forEach(h => {
                    const d = new Date(h.date).toDateString();
                    dayCounts[d] = (dayCounts[d] || 0) + 1;
                });
                stats.marathonDays = Object.values(dayCounts).filter(c => c >= 10).length;
                // Groups played
                const groups = new Set();
                (questions || []).forEach(q => {
                    const qid = q.questionId;
                    if (qs[qid] && (qs[qid].asked || 0) > 0) groups.add(q.group || q._fileGroup || 'Standard');
                });
                stats.groupsPlayed = groups.size;
                // Ability stats
                const au = bs.abilitiesUsed || {};
                stats.ab_fiftyFifty = au.fiftyFifty || 0;
                stats.ab_hint = au.hint || 0;
                stats.ab_skip = au.skip || 0;
                stats.ab_secondChance = au.secondChance || 0;
                stats.ab_doubleXP = au.doubleXP || 0;
                stats.ab_shield = au.shield || 0;
                stats.ab_phoneJoker = au.phoneJoker || 0;
                stats.uniqueAbilities = Object.values(au).filter(v => v > 0).length;
                // Total mini-games
                stats.totalMiniGames = (stats.spinnerPlays || 0) + (stats.bossAttempts || 0);
                return stats;
            },

            getBadgeTier(value, thresholds, inverted) {
                if (!thresholds || !Array.isArray(thresholds)) return 0;
                let tier = 0;
                for (let i = 0; i < thresholds.length; i++) {
                    if (inverted ? value <= thresholds[i] : value >= thresholds[i]) tier = i + 1;
                    else break;
                }
                return Math.min(tier, 5);
            },

            getBadgeProgress(value, thresholds) {
                if (!thresholds || thresholds.length === 0) return 100;
                for (let i = 0; i < thresholds.length; i++) {
                    if (value < thresholds[i]) {
                        const prev = i > 0 ? thresholds[i - 1] : 0;
                        return Math.min(100, Math.round(((value - prev) / (thresholds[i] - prev)) * 100));
                    }
                }
                return 100;
            },

            updateSidebarTopVar() {
                const header = document.querySelector('header');
                if (header) {
                    document.documentElement.style.setProperty('--sidebar-top', header.offsetHeight + 'px');
                }
            },

            renderSidebars(user) {
                if (!user || !PluginRegistry.isEnabled('BadgePlugin')) return;
                this.updateSidebarTopVar();
                const defs = this.getBadgeDefinitions();
                const stats = this.calculateBadgeStats(user);
                // Left sidebar: Quiz + Mini-Game badges
                const leftBadges = Object.values(defs).filter(b => b.cat === 'leistung' || b.cat === 'minigame');
                const rightBadges = Object.values(defs).filter(b => b.cat === 'faehigkeit');
                document.getElementById('badgeSidebarTitleLeft').textContent = user.name;
                document.getElementById('badgeSidebarTitleRight').textContent = user.name;
                document.getElementById('badgeListLeft').innerHTML =
                    '<div class="badge-sidebar-section"><div class="badge-sidebar-title">🏆 Leistung</div>' +
                    this.renderBadgeItems(Object.values(defs).filter(b => b.cat === 'leistung'), stats) +
                    '</div><div class="badge-sidebar-section"><div class="badge-sidebar-title">🎮 Mini-Games</div>' +
                    this.renderBadgeItems(Object.values(defs).filter(b => b.cat === 'minigame'), stats) + '</div>';
                document.getElementById('badgeListRight').innerHTML =
                    '<div class="badge-sidebar-section"><div class="badge-sidebar-title">⚡ Fähigkeiten</div>' +
                    this.renderBadgeItems(rightBadges, stats) +
                    '</div>' + this.renderAbilitySidebar(user);
                // Show sidebars (explicit 'flex' to override CSS media queries)
                const sl = document.getElementById('badgeSidebarLeft');
                const sr = document.getElementById('badgeSidebarRight');
                if (sl) sl.style.display = 'flex';
                if (sr) sr.style.display = 'flex';
                // Restore collapsed state
                if (this._sidebarState.left.collapsed) {
                    if (sl) sl.style.display = 'none';
                    document.getElementById('sidebarToggleLeft').style.display = 'block';
                }
                if (this._sidebarState.right.collapsed) {
                    if (sr) sr.style.display = 'none';
                    document.getElementById('sidebarToggleRight').style.display = 'block';
                }
                this.restoreSidebarPositions();
            },

            renderBadgeItems(badges, stats) {
                if (!badges || badges.length === 0) return '';
                return '<div class="badge-icon-grid">' +
                    badges.filter(b => b.active !== false).map(b => {
                    const val = stats[b.stat] || 0;
                    const tier = this.getBadgeTier(val, b.thresholds, b.inverted);
                    const progress = this.getBadgeProgress(val, b.thresholds);
                    const color = this.TIER_COLORS[tier > 0 ? tier - 1 : 0];
                    const locked = tier === 0;
                    const icon = b.customIcon || b.emoji;
                    const progressPill = progress < 100 ? `<div class="badge-progress">${progress}%</div>` : '';
                    return `<div class="badge-item ${locked ? 'locked' : ''} badge-${color}"
                        onmouseenter="BadgePlugin.showBadgeTooltip(event,'${b.id}')"
                        onmouseleave="BadgePlugin.hideBadgeTooltip()"
                        data-badge-id="${b.id}" data-tier="${tier}" data-value="${val}"><span class="badge-icon-wrap">${icon}</span>${progressPill}</div>`;
                }).join('') + '</div>';
            },

            _abilityStatLabels: {
                _fifty50Sessions: 'Burst-Sessions (2+ Quizze/h)',
                totalQuizzes: 'Quizze gespielt',
                uniqueQuestions: 'Verschiedene Fragen',
                totalAnswers: 'Beantwortete Fragen',
                perfectQuizzes: 'Perfekte Quizze (100%)',
                currentStreak: 'Tage Streak',
                activeDays3: 'Tage mit 3+ Quizzen',
                _phoneJokerUsed: 'Telefon-Joker genutzt',
                highAverageQuizzes: 'Quizze mit ≥80%'
            },

            renderAbilitySidebar(user) {
                if (!user || !PluginRegistry.isEnabled('AbilityPlugin')) return '';
                const defs = AbilityPlugin.DEFS;
                if (!defs) return '';
                const statValues = AbilityPlugin.getStatValues ? AbilityPlugin.getStatValues(user) : {};
                let html = '<div class="badge-sidebar-section"><div class="badge-sidebar-title">🎯 Fähigkeiten</div>';
                Object.keys(defs).forEach(key => {
                    const def = defs[key];
                    const charges = AbilityPlugin.getCharges ? AbilityPlugin.getCharges(key) : 0;
                    const earnPer = def.earnPer || 5;
                    const statVal = statValues[def.earnStat] || 0;
                    const totalEarned = Math.floor(statVal / earnPer);
                    const unlocked = totalEarned > 0 || charges > 0;
                    const progressToNext = statVal % earnPer;
                    const progressPct = Math.round((progressToNext / earnPer) * 100);
                    const statLabel = this._abilityStatLabels[def.earnStat] || def.earnStat;
                    const tooltip = `${def.name}: ${def.desc}\nFortschritt: ${progressToNext}/${earnPer} ${statLabel}\nGesamt: ${statVal} ${statLabel} → ${totalEarned} Ladungen`;
                    html += `<div class="ability-sidebar-item ${unlocked ? 'unlocked' : ''}" title="${tooltip}">
                        <div class="ab-progress" style="width:${progressPct}%"></div>
                        <span class="ab-icon">${def.icon}</span>
                        <span class="ab-name">${def.name}</span>
                        <span class="ab-charges ${charges === 0 ? 'empty' : ''}">${charges}×</span>
                    </div>`;
                });
                html += '<div style="font-size:0.55rem;opacity:0.4;text-align:center;margin-top:4px;">Stats schalten Ladungen frei</div>';
                return html + '</div>';
            },

            showBadgeTooltip(event, badgeId) {
                const defs = this.getBadgeDefinitions();
                const b = defs[badgeId];
                if (!b) return;
                const user = currentUser;
                const stats = user ? this.calculateBadgeStats(user) : {};
                const val = stats[b.stat] || 0;
                const tier = this.getBadgeTier(val, b.thresholds, b.inverted);
                const progress = this.getBadgeProgress(val, b.thresholds);
                const nextThreshold = b.thresholds.find(t => val < t);
                const tt = document.getElementById('globalBadgeTooltip');
                if (!tt) return;
                let tierHtml = b.thresholds.map((t, i) => {
                    const achieved = val >= t;
                    return `<span style="color:${achieved ? ['#888','#2ecc71','#3498db','#9b59b6','#f1c40f'][i] : '#555'}">${this.TIER_ICONS[i]} ${t}</span>`;
                }).join(' → ');
                tt.innerHTML = `<div style="font-size:1.5rem;margin-bottom:4px;">${b.customIcon || b.emoji} ${b.name}</div>
                    <div style="opacity:0.8;margin-bottom:6px;">${b.desc}</div>
                    <div style="margin-bottom:4px;">Stufe: ${tier > 0 ? this.TIER_ICONS[tier-1] : '⚪'} (${val}${nextThreshold ? ' / ' + nextThreshold : ''})</div>
                    <div class="badge-progress"><div class="badge-progress-fill" style="width:${progress}%"></div></div>
                    <div style="font-size:0.75rem;margin-top:4px;">${tierHtml}</div>`;
                tt.classList.add('visible');
                const rect = event.target.closest('.badge-item')?.getBoundingClientRect();
                if (rect) {
                    tt.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';
                    tt.style.top = (rect.bottom + 8) + 'px';
                }
            },

            hideBadgeTooltip() {
                const tt = document.getElementById('globalBadgeTooltip');
                if (tt) tt.classList.remove('visible');
            },

            hideSidebars() {
                ['badgeSidebarLeft','badgeSidebarRight','sidebarToggleLeft','sidebarToggleRight'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
            },

            showUserBadges(userId) {
                const user = users.find(u => u.id == userId);
                if (user) this.renderSidebars(user);
            },

            toggleSidebarCollapse(side) {
                const state = this._sidebarState[side];
                state.collapsed = !state.collapsed;
                const sidebarId = side === 'left' ? 'badgeSidebarLeft' : 'badgeSidebarRight';
                const toggleId = side === 'left' ? 'sidebarToggleLeft' : 'sidebarToggleRight';
                const sidebar = document.getElementById(sidebarId);
                const toggle = document.getElementById(toggleId);
                if (state.collapsed) {
                    if (sidebar) sidebar.style.display = 'none';
                    if (toggle) toggle.style.display = 'block';
                } else {
                    if (sidebar) sidebar.style.display = 'flex';
                    if (toggle) toggle.style.display = 'none';
                }
            },

            saveSidebarPosition(side) {
                if (!currentUser) return;
                const sidebarId = side === 'left' ? 'badgeSidebarLeft' : 'badgeSidebarRight';
                const sidebar = document.getElementById(sidebarId);
                if (!sidebar) return;
                if (!currentUser.sidebarPositions) currentUser.sidebarPositions = {};
                currentUser.sidebarPositions[side] = { top: sidebar.style.top || null };
                const resetBtn = document.getElementById(side === 'left' ? 'sidebarResetLeft' : 'sidebarResetRight');
                if (resetBtn) resetBtn.style.display = '';
                Toast.show('Position gespeichert', 'success');
            },

            resetSidebarPosition(side) {
                const sidebarId = side === 'left' ? 'badgeSidebarLeft' : 'badgeSidebarRight';
                const sidebar = document.getElementById(sidebarId);
                if (sidebar) {
                    sidebar.style.top = '';
                    sidebar.classList.remove('user-positioned');
                }
                if (currentUser && currentUser.sidebarPositions) {
                    delete currentUser.sidebarPositions[side];
                }
                const resetBtn = document.getElementById(side === 'left' ? 'sidebarResetLeft' : 'sidebarResetRight');
                if (resetBtn) resetBtn.style.display = 'none';
                Toast.show('Standardposition', 'info');
            },

            restoreSidebarPositions() {
                if (!currentUser || !currentUser.sidebarPositions) return;
                ['left','right'].forEach(side => {
                    const pos = currentUser.sidebarPositions[side];
                    if (!pos) return;
                    const sidebarId = side === 'left' ? 'badgeSidebarLeft' : 'badgeSidebarRight';
                    const sidebar = document.getElementById(sidebarId);
                    if (sidebar && pos.top) {
                        sidebar.style.top = pos.top;
                        sidebar.classList.add('user-positioned');
                    }
                    const resetBtn = document.getElementById(side === 'left' ? 'sidebarResetLeft' : 'sidebarResetRight');
                    if (resetBtn && pos.top) resetBtn.style.display = '';
                    const saveBtn = document.getElementById(side === 'left' ? 'sidebarSaveLeft' : 'sidebarSaveRight');
                    if (saveBtn) saveBtn.style.display = '';
                });
            },

            _initSidebarDrag() {
                document.querySelectorAll('.sidebar-drag-handle-inline').forEach(handle => {
                    handle.addEventListener('mousedown', e => {
                        const sidebar = handle.closest('.badge-sidebar');
                        if (!sidebar) return;
                        e.preventDefault();
                        sidebar.classList.add('dragging');
                        const startY = e.clientY;
                        const startTop = sidebar.offsetTop;
                        const side = sidebar.classList.contains('badge-sidebar-left') ? 'left' : 'right';
                        const onMove = ev => {
                            const newTop = Math.max(0, startTop + (ev.clientY - startY));
                            sidebar.style.top = newTop + 'px';
                            sidebar.classList.add('user-positioned');
                        };
                        const onUp = () => {
                            sidebar.classList.remove('dragging');
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onUp);
                            const saveBtn = document.getElementById(side === 'left' ? 'sidebarSaveLeft' : 'sidebarSaveRight');
                            if (saveBtn) saveBtn.style.display = '';
                        };
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                    });
                });
            },

            renderBadgeAdmin() {
                const container = document.getElementById('adminBadges');
                if (!container) return;
                const defs     = this.getBadgeDefinitions();
                const catLabel = { leistung: '📈 Leistung', faehigkeit: '🃏 Fähigkeiten', minigame: '🎰 Mini-Games' };
                const cats     = ['leistung', 'faehigkeit', 'minigame'];

                const rows = cats.map(cat => {
                    const badges = Object.values(defs).filter(b => b.cat === cat);
                    const badgeRows = badges.map(b => `
                        <tr>
                            <td style="width:36px;text-align:center;font-size:1.2rem">
                                <input type="text" id="badgeIcon_${b.id}" value="${b.customIcon || b.emoji}"
                                    style="width:36px;text-align:center;padding:2px;font-size:1.1rem;background:var(--overlay-8);border:1px solid var(--overlay-20);border-radius:4px;color:inherit">
                            </td>
                            <td style="font-weight:600;font-size:0.88rem">${b.name}</td>
                            <td style="opacity:0.6;font-size:0.82rem">${b.desc}</td>

        function normalizeUser(u) {

                .toLowerCase().slice(0, 4) || 'manu';

        function assignStableId(group, allQuestions) {

                    const n = parseInt(q.questionId.split('_')[1], 10);

            return prefix + '_' + String(max + 1).padStart(5, '0');

            const fileGroup = q._fileGroup || null;

            if (q.type === QUESTION_TYPES.IMAGEMAP) {
                return {
                    questionId: resolveId(),
                    _fileGroup: fileGroup,
                    text: text,
                    type: QUESTION_TYPES.IMAGEMAP,
                    targets: q.targets || (q.target ? [q.target] : []),
                    active: q.active !== false,
                    media: q.media || null,
                    explanation: q.explanation || null,

            if (q.type === QUESTION_TYPES.TEXT || (q.correctAnswer && !q.answers)) {
                const textAnswers = getCorrectTextAnswers(q);
                return {
                    questionId: resolveId(),
                    _fileGroup: fileGroup,
                    text: text,
                    type: QUESTION_TYPES.TEXT,
                    answers: [{ type: QUESTION_TYPES.TEXT, correctAnswers: textAnswers }],
                    correctAnswer: textAnswers,
                    active: q.active !== false,
                    media: q.media || null,
                    explanation: q.explanation || null,
                    explanationMedia: q.explanationMedia || null,
                    hint: q.hint || null,
                    hintMedia: q.hintMedia || null
                };

            let rawAnswers = q.answers || [];

                _fileGroup: fileGroup,

                explanationMedia: q.explanationMedia || null,
                hint: q.hint || null,
                hintMedia: q.hintMedia || null

        }

        async function loadFromFolderInput(event) {
          try {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            // FileList → Array konvertieren für sichere Iteration
            const fileArray = Array.from(files);

            // Ordnername aus dem ersten Dateipfad extrahieren
            const firstPath = fileArray[0].webkitRelativePath;
            loadedFolderName = firstPath.split('/')[0];

            let masterData = null;
            let playerFiles = [];

            // Alle JSON-Dateien sammeln und lesen
            const readPromises = [];

            for (let fi = 0; fi < fileArray.length; fi++) {
                (function(file) {
                if (file.name.endsWith('.json')) {
                    const promise = new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                let raw = e.target.result;
                                let data;
                                try { data = JSON.parse(raw); } catch(e1) {
                                    try { data = JSON.parse(decodeURIComponent(escape(atob(raw.trim())))); }
                                    catch(e2) { throw new Error('Ungültiges Format'); }
                                }
                                resolve({
                                    name: file.name,
                                    data: data,
                                    lastModified: file.lastModified
                                });
                            } catch (err) {
                                console.warn('Datei konnte nicht gelesen werden:', file.name, err.message);
                                resolve(null);
                            }
                        };
                        reader.onerror = () => { console.warn('Lesefehler:', file.name); resolve(null); };
                        reader.readAsText(file);
                    });
                    readPromises.push(promise);
                }
                })(fileArray[fi]);
            }

            let questionFiles = [];
            const skippedFiles = [];
            const unrecognizedJsonFiles = [];
            for (const result of results) {

                    masterFiles.push(result);

                unrecognizedJsonFiles.forEach(function(f) { warnMsg += '• ' + f + '\n'; });
                warnMsg += '\nBitte umbenennen zu: 03_questions_THEMA_DATUM.json\n';

            console.log('Ordner-Laden: ' + results.filter(Boolean).length + ' JSON-Dateien, ' + masterFiles.length + ' Master, ' + questionFiles.length + ' Fragen-Dateien, ' + playerFiles.length + ' Spieler, ' + skippedFiles.length + ' übersprungen');
            if (playerFiles.length > 0) console.log('Spieler-Dateien:', playerFiles.map(function(p){ return p.name; }).join(', '));
            if (questionFiles.length > 0) console.log('Fragen-Dateien:', questionFiles.map(function(p){ return p.name; }).join(', '));

                totalFiles: playerFileCount[pf.data.name] || 1
            }));

            Object.values(playersByName).forEach(pf => {
                users.push(normalizeUser(pf.data));
            });

            // SR-Bug 4: consecutiveCorrect aus alten JSONs zurücksetzen wenn Cooldown längst abgelaufen
            (function() {
                const sr = quizSettings.spacedRepetition || {};
                const threshold = sr.streakThreshold || 2;
                const cooldownMs = (sr.streakCooldown || 48) * 3600000;
                const now = Date.now();
                users.forEach(function(u) {
                    if (!u.questionStats) return;
                    Object.values(u.questionStats).forEach(function(s) {
                        if ((s.consecutiveCorrect || 0) >= threshold && s.lastAsked) {
                            if (now - new Date(s.lastAsked).getTime() >= cooldownMs)
                                s.consecutiveCorrect = 0;
                        }
                    });
                });
            })();

            // Cross-Reference: Phone-Joker System (3 Phasen)
            const jokerExpiryMs = CONFIG.TIMER.GHOST_CLEANUP_MONTHS * 30 * 24 * 60 * 60 * 1000;
            const jokerExpiryThreshold = Date.now() - jokerExpiryMs;

            // Phase 1: Resolved Joker verarbeiten → Sender-Bonus berechnen
            // B hat eine Joker-Frage beantwortet (resolved:true auf B.pendingPhoneJoker).
            // Jetzt A's sentPhoneJokers als resolved markieren + Bonus auf A schreiben.
            users.forEach(function(target) {
                if (!target.pendingPhoneJoker) return;
                target.pendingPhoneJoker.forEach(function(entry) {
                    if (!entry.resolved) return;
                    var sender = users.find(function(u){ return u.name === entry.from; });
                    if (!sender || !sender.sentPhoneJokers) return;
                    var sentEntry = sender.sentPhoneJokers.find(function(s) {
                        return s.questionId === entry.questionId && s.targetName === target.name && !s.resolved;
                    });
                    if (!sentEntry) return; // bereits verarbeitet
                    // Sender's sent-Eintrag als resolved markieren (wird in Phase 2 aufgeräumt)
                    sentEntry.resolved = true;
                    // Bonus nur einmal anwenden (bonusApplied verhindert Doppel-Bonus)
                    if (!entry.bonusApplied && entry.correct) {
                        var xpSettings = quizSettings.xpSystem || {};
                        var bonusXP = (xpSettings.correctAnswerXP || 10) * 5;
                        if (!sender.pendingJokerBonus) sender.pendingJokerBonus = 0;
                        sender.pendingJokerBonus += bonusXP;
                    }
                    entry.bonusApplied = true;
                });
            });

            // Phase 2: Verwaiste resolved-Einträge aufräumen
            // Muss VOR Phase 3 laufen: solange A's sentPhoneJokers noch nicht bereinigt wurden,
            // darf B's Quittung nicht entfernt werden — sonst erstellt Phase 3 den Joker neu
            // wenn A's Datei noch den unresolved Eintrag enthält.
            users.forEach(function(target) {
                if (!target.pendingPhoneJoker) return;
                target.pendingPhoneJoker = target.pendingPhoneJoker.filter(function(entry) {
                    if (!entry.resolved) return true; // offene behalten
                    // Abgelaufene resolved-Einträge entfernen
                    if (entry.date && new Date(entry.date).getTime() < jokerExpiryThreshold) return false;
                    // Quittung nur entfernen wenn Sender keinen passenden sent-Eintrag mehr hat
                    var sender = users.find(function(u){ return u.name === entry.from; });
                    if (!sender || !sender.sentPhoneJokers) return false;
                    return sender.sentPhoneJokers.some(function(s) {
                        return s.questionId === entry.questionId && s.targetName === target.name;
                    });
                });
            });

            // Phase 3: sentPhoneJokers aufräumen + pending aus sent erzeugen
            users.forEach(function(sender) {
                if (!sender.sentPhoneJokers || sender.sentPhoneJokers.length === 0) return;
                // Ghost-Joker Cleanup: resolved, abgelaufene, inaktive Fragen entfernen
                sender.sentPhoneJokers = sender.sentPhoneJokers.filter(function(joker) {
                    if (joker.resolved) return false;
                    if (joker.date && new Date(joker.date).getTime() < jokerExpiryThreshold) return false;
                    var qExists = questions.some(function(qq){ return qq.questionId === joker.questionId && qq.active !== false; });
                    return qExists;
                });
                // Pending-Einträge erzeugen für offene sent-Einträge
                sender.sentPhoneJokers.forEach(function(joker) {
                    var target = users.find(function(u){ return u.name === joker.targetName; });
                    if (target) {
                        if (!target.pendingPhoneJoker) target.pendingPhoneJoker = [];
                        var exists = target.pendingPhoneJoker.some(function(p) {
                            return p.from === joker.from && p.questionId === joker.questionId;
                        });
                        if (!exists) {
                            target.pendingPhoneJoker.push({
                                from: joker.from, questionId: joker.questionId,
                                questionText: joker.questionText, date: joker.date
                            });
                        }
                    }
                });
            });

            // Modus setzen
            multiPlayerMode = true;
            dataLoaded = true;
            syncToAppState();
            EventBus.emit('data:loaded', { questions: questions.length, users: users.length, source: 'folder' });

            // UI aktualisieren
            updateFolderStatus(playerFiles.length, Object.keys(playersByName).length, loadedQuestionFiles);

            document.getElementById('quizTitle').textContent = quizSettings.quizName || 'XY Quiz';
            const et = document.getElementById('encryptToggle');
            if (et) { et.checked = !!quizSettings.encryptPlayerData; document.getElementById('encryptHint').textContent = quizSettings.encryptPlayerData ? 'Base64-kodiert (alle Dateien)' : 'Klartext'; }

            renderUserSelect();
            renderLeaderboard();
            updateQuestionsList();
            updateUsersList();

            // Ordner-Anzeige
            document.getElementById('modeFolder').textContent = loadedFolderName;
            document.getElementById('modeOperatorCount').textContent = users.length;

            // Duplikate anzeigen
            let dupNames = [];
            let dupTotal = 0;
            loadedPlayerFiles.forEach(function(pf) {
                if (pf.totalFiles > 1) {
                    dupNames.push(pf.playerName + '(' + pf.totalFiles + ')');
                    dupTotal += pf.totalFiles - 1;
                }
            });
            let dupEl = document.getElementById('modeDuplicates');
            let modeEl = document.getElementById('modeIndicator');
            if (dupEl) {
                if (dupTotal > 0) {
                    dupEl.textContent = 'Duplicates: ' + dupTotal + ' (' + dupNames.join(', ') + ')';
                    if (modeEl) {
                        modeEl.style.background = 'linear-gradient(135deg, #7d2b09, #c0392b)';
                        modeEl.style.boxShadow  = '0 10px 30px rgba(192, 57, 43, 0.4)';
                    }
                } else {
                    dupEl.textContent = 'Duplicates: 0';
                    if (modeEl) {
                        modeEl.style.background = '';
                        modeEl.style.boxShadow  = '';
                    }
                }
            }

            // Fragen-Übersicht: Gesamt + Kategorien
            const mqEl = document.getElementById('modeQuestions');
            if (mqEl && typeof questions !== 'undefined') {
                const active = questions.filter(q => q.active !== false);
                const groups = {};
                active.forEach(q => {
                    const g = q._fileGroup || '?';
                    groups[g] = (groups[g] || 0) + 1;

                const groupStr = Object.entries(groups)
                    .sort((a, b) => b[1] - a[1])
                    .map(([g, n]) => g + '\u00a0' + n)
                    .join(' · ');
                mqEl.textContent = 'Fragen: ' + active.length + ' — ' + groupStr;
            }

            showScreen('startScreen');

            event.target.value = ''; // Reset input
          } catch(err) {
            console.error('Ordner-Laden Fehler:', err);
            GameDialog.showError('Fehler beim Laden des Ordners', err.message + '\n\nStack:\n' + (err.stack || '').split('\n').slice(0,5).join('\n'));
          }
        }

        const AdminShell = (() => {
            const _panels = [];

            // Wird von 20-admin-datei.js nach erfolgreichem Laden aufgerufen

            function unlock() {

            function _showPasswordModal() {
                const modal = document.getElementById('forgePasswordModal');
                if (!modal) return;
                modal.style.display = 'flex';
                const input = document.getElementById('forgePasswordInput');
                if (input) { input.value = ''; input.focus(); }
                const err = document.getElementById('forgePasswordError');
                if (err) err.classList.remove('active');
            }

            function _hidePasswordModal() {
                const modal = document.getElementById('forgePasswordModal');
                if (modal) modal.style.display = 'none';
            }

            function checkPassword(event) {
                event.preventDefault();
                const input   = document.getElementById('forgePasswordInput');
                const error   = document.getElementById('forgePasswordError');
                const entered = input ? input.value : '';
                const pw      = (typeof quizSettings !== 'undefined') ? (quizSettings.adminPassword || '') : '';

                if (entered === pw) {
                    _hidePasswordModal();
                    _buildNav();
                } else {
                    error && error.classList.add('active');
                    if (input) { input.value = ''; input.focus(); }
                }
            }

            // ── Tab-System ────────────────────────────────────────────────────────────

            function registerPanel(id, label, icon, renderFn) {
                _panels.push({ id, label, icon, renderFn });
            }

            function registerSeparator() {
                _panels.push({ type: 'separator' });
            }

            function _renderPanel(id) {
                const p     = _panels.find(p => p.id === id);
                const panel = document.getElementById('adminPanel_' + id);
                if (!p || !panel) return;
                panel.innerHTML = '';
                try { p.renderFn(panel); }
                catch (e) {
                    panel.innerHTML = `<div class="card" style="color:var(--incorrect)">Fehler beim Laden: ${e.message}</div>`;
                }
            }

            function showPanel(id) {
                document.querySelectorAll('.admin-panel').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.admin-nav-item').forEach(el => el.classList.remove('active'));
                const panel  = document.getElementById('adminPanel_' + id);
                const navBtn = document.getElementById('adminNav_' + id);
                if (panel)  panel.classList.add('active');
                if (navBtn) navBtn.classList.add('active');
                _renderPanel(id);
            }

            function _buildNav() {
                const nav     = document.getElementById('adminNav');
                const content = document.getElementById('adminContent');
                if (!nav || !content) return;

                if (_panels.length === 0) {
                    content.innerHTML = `
                        <div class="admin-empty">
                            <div class="admin-empty-icon">🔧</div>
                            <div>Keine Module geladen</div>
                        </div>`;
                    return;
                }

                nav.innerHTML     = '';
                content.innerHTML = '';

                _panels.forEach(p => {
                    if (p.type === 'separator') {
                        const sep = document.createElement('div');
                        sep.style.cssText = 'height:20px;flex-shrink:0';
                        nav.appendChild(sep);
                        return;
                    }

                    const btn = document.createElement('button');
                    btn.className = 'admin-nav-item';
                    btn.id        = 'adminNav_' + p.id;
                    btn.innerHTML = `<span>${p.icon}</span><span>${p.label}</span>`;
                    btn.onclick   = () => showPanel(p.id);
                    nav.appendChild(btn);

                    const panel   = document.createElement('div');
                    panel.className = 'admin-panel';
                    panel.id        = 'adminPanel_' + p.id;
                    content.appendChild(panel);
                });

                if (_panels[0]) showPanel(_panels[0].id);
            }

            document.addEventListener('DOMContentLoaded', _buildNav);

            return { registerPanel, registerSeparator, showPanel, unlock, checkPassword };
        })();

            document.getElementById('adminFolderInput').addEventListener('change', _adminLoadFolder);

        async function _adminLoadFolder(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            loadedFolderName = files[0].webkitRelativePath.split('/')[0];

            // Alle JSON-Dateien lesen
            const results = await Promise.all(
                files
                    .filter(f => f.name.endsWith('.json'))
                    .map(f => new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = e => {
                            try {
                                let raw = e.target.result;
                                let data;
                                try { data = JSON.parse(raw); }
                                catch { data = JSON.parse(decodeURIComponent(escape(atob(raw.trim())))); }
                                resolve({ name: f.name, data, lastModified: f.lastModified });
                            } catch { resolve(null); }
                        };
                        reader.onerror = () => resolve(null);
                        reader.readAsText(f);
                    }))
            );

            const valid = results.filter(Boolean);

            const masterFiles  = valid.filter(r => /^02_(quiz-master|QUIZ-MASTER)/i.test(r.name));
            const playerFiles  = valid.filter(r => /^04_(operator|Operator)_/i.test(r.name));
            const questionFiles = valid.filter(r => /^03_(questions|Questions)_/i.test(r.name));

            // Settings aus neuester Master-Datei
            if (masterFiles.length) {
                masterFiles.sort((a, b) => b.lastModified - a.lastModified);
                const master = masterFiles[0].data;
                quizSettings = ensureSettingsDefaults(Object.assign({}, quizSettings, master.settings || {}));
            }

            // Fragen laden
            questions = [];
            loadedQuestionFiles = [];
            questionFiles.forEach(qf => {
                const fileTheme = qf.data.theme || '';
                const qList = qf.data.questions || [];
                let loaded = 0;
                qList.forEach((q, qi) => {
                    try {
                        q._fileGroup = q._fileGroup || fileTheme || 'Manuell';
                        const n = normalizeQuestion(q);
                        const isDupe = n.questionId && questions.some(eq => eq.questionId === n.questionId);
                        if (isDupe) return;
                        n.sourceFile = qf.name;
                        questions.push(n);
                        loaded++;
                    } catch { /* fehlerhafte Frage überspringen */ }
                });
                loadedQuestionFiles.push({ name: qf.name, theme: fileTheme || 'Unbekannt', count: loaded });
            });

            // Spieler laden (neueste Version pro Name)
            users = [];
            loadedPlayerFiles = [];
            _adminPlayerDupes = [];
            const byName = {};
            const countByName = {};
            playerFiles.forEach(pf => {
                if (!pf.data || !pf.data.name) return;
                countByName[pf.data.name] = (countByName[pf.data.name] || 0) + 1;
                if (!byName[pf.data.name] || pf.lastModified > byName[pf.data.name].lastModified)
                    byName[pf.data.name] = pf;
            });
            Object.values(byName).forEach(pf => {
                users.push(pf.data);
                loadedPlayerFiles.push({ name: pf.name, playerName: pf.data.name });
            });
            _adminPlayerDupes = Object.entries(countByName)
                .filter(([, c]) => c > 1)
                .map(([name, count]) => ({ name, count }));

            dataLoaded = true;
            syncToAppState();

            event.target.value = '';

            Toast.show(`✅ Geladen: ${users.length} Spieler, ${questions.length} Fragen`, 'success');

            // User-JSON Größen-Warnung
            if (users.length) {
                const sizes = users.map(u => JSON.stringify(u).length);
                const maxSize = Math.max(...sizes);
                const avgSize = Math.round(sizes.reduce((a, b) => a + b, 0) / sizes.length);
                const maxUser = users[sizes.indexOf(maxSize)].name || '?';
                const kb = n => (n / 1024).toFixed(1) + ' KB';
                const level = maxSize > 400000 ? 'error' : maxSize > 200000 ? 'warning' : 'info';
                setTimeout(() => Toast.show(
                    `📦 User-JSONs: Ø ${kb(avgSize)} · Größte: ${maxUser} (${kb(maxSize)})`,
                    level, 8000
                ), 1500);
            }

            // Passwort prüfen → Tabs freischalten (oder direkt wenn leer)
            AdminShell.unlock();
        }


        function _adminDownloadJSON(data, filename) {
            let content = JSON.stringify(data, null, 2);
            if (quizSettings.encryptPlayerData) {
                try { content = btoa(unescape(encodeURIComponent(content))); } catch(e) {}
            }
            const blob = new Blob([content], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }


        function _adminExportAllPlayers() {
            if (!users.length) { Toast.show('Keine Spieler geladen.', 'warning'); return; }
            const now = new Date();
            const ts = now.toISOString().slice(0,19).replace('T','_').replace(/:/g,'');
            users.forEach(u => {
                const safeName = (u.name || 'unbekannt').replace(/[^a-zA-Z0-9_\-]/g, '_');
                _adminDownloadJSON(u, `04_operator_${safeName}_${ts}.json`);
            });
            Toast.show(`${users.length} Spieler-Dateien werden heruntergeladen.`, 'success');
        }


        function _adminSpielerSummary() {
            if (!_adminPlayerDupes.length) return String(users.length);
            const dupeList = _adminPlayerDupes.map(d => `${d.name} [${d.count}×]`).join(', ');
            return `${users.length} <span style="color:var(--incorrect);font-size:0.85em;opacity:0.9">`
                 + `· ${_adminPlayerDupes.length} Duplikat${_adminPlayerDupes.length > 1 ? 'e' : ''}: ${dupeList}</span>`;
        }

        // ── Panel ─────────────────────────────────────────────────────────────────────

        AdminShell.registerPanel('fragen', 'Fragen', '🗂', container => {

        // ── Listen-Ansicht ────────────────────────────────────────────────────────────

        function _fqMatchesSearch(q, term) {
            if (!term) return true;
            const t = term.toLowerCase();
            if ((q.text || '').toLowerCase().includes(t)) return true;
            if ((q.questionId || '').toLowerCase().includes(t)) return true;
            if ((q._fileGroup || '').toLowerCase().includes(t)) return true;
            if (q.answers && q.answers.some(a => (a.text || '').toLowerCase().includes(t))) return true;
            if ((q.answer || '').toLowerCase().includes(t)) return true;
            return false;
        }

        function _fqSearch(val) {
            _fqSearchTerm = val;
            AdminShell.showPanel('fragen');
            const inp = document.getElementById('fqSearchInput');
            if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }

        function _fqRenderList(container) {
            const typeIcon = t => t === QUESTION_TYPES.TEXT ? '📝' : t === QUESTION_TYPES.IMAGEMAP ? '🗺' : '☑';

            const isSearch = term.length > 0;

                const allGroupQs = questions
                    .map((q, idx) => ({ q, idx }))
                    .filter(({ q }) => (q._fileGroup || 'Manuell') === g);

                    ? allGroupQs.filter(({ q }) => _fqMatchesSearch(q, term))

                const isOpen = isSearch ? true : _fqOpenGroups.has(g);

                if (!isOpen) return header;

                const qRows = groupQs.map(({ q, idx }) => {
                    const expanded = _fqEditIdx === idx;

                    <td style="opacity:0.55;font-size:0.78rem;font-family:monospace">${q.questionId || '—'}</td>
                    <td style="width:20px;text-align:center;opacity:0.4;font-size:0.7rem">${rowArrow}</td>
                </tr>`;
                    if (!expanded) return mainRow;
                    return mainRow + `<tr><td colspan="5" style="padding:0">${_fqBuildInlineHTML(idx)}</td></tr>`;
                }).join('');

                return header + qRows;
            }).join('');

            const totalHits = isSearch ? questions.filter(q => _fqMatchesSearch(q, term)).length : null;

                        </div>
                        <input type="text" id="fqSearchInput" placeholder="Suche…" value="${_fqEsc(term)}"
                            oninput="_fqSearch(this.value)"

                            ↓ Exportieren

                            📥 Importieren

                                <td style="padding:10px 8px">Gruppe</td>
                                <td style="padding:10px 8px">ID</td>

                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows || '<tr><td colspan="5" style="text-align:center;padding:30px;opacity:0.4">Keine Treffer</td></tr>'}
                        </tbody>
                    </table>
                </div>`;
        }

            if (_fqOpenGroups.has(groupName)) {
                _fqOpenGroups.delete(groupName);
            } else {
                _fqOpenGroups.add(groupName);

            AdminShell.showPanel('fragen');

                </div>
            </div>`;

        function _fqDeleteInline(idx) {
            const q = questions[idx];
            if (!q) return;
            if (!confirm('Frage "' + _fqEsc((q.text || '').substring(0, 60)) + '" löschen?')) return;
            questions.splice(idx, 1);
            _fqEditIdx = -1;
            AdminShell.showPanel('fragen');
        }

        function _fqHandleMediaBrowse(event, targetInputId) {
            const file = event.target.files[0];
            if (!file) return;
            const relativePath = file.webkitRelativePath
                ? 'medien/' + file.webkitRelativePath
                : 'medien/' + file.name;
            const el = document.getElementById(targetInputId);
            if (el) el.value = relativePath;
        }

        // ── Formular (Neue Frage) ──────────────────────────────────────────────────────

        function _fqOpenForm() {
            _fqEditIdx  = -1;
            _fqShowForm = true;
            _fqFormType = QUESTION_TYPES.MULTIPLE_CHOICE;
            _fqImReset();
            AdminShell.showPanel('fragen');
        }

        function _fqOpenEdit(idx) {
            if (_fqEditIdx === idx) {
                _fqEditIdx = -1;
                AdminShell.showPanel('fragen');
                return;
            }
            const q = questions[idx];
            if (!q) return;
            _fqEditIdx  = idx;
            _fqShowForm = false;
            _fqFormType = q.type || QUESTION_TYPES.MULTIPLE_CHOICE;
            _fqImReset();
            if (q.type === QUESTION_TYPES.IMAGEMAP) {
                _fqImZones    = q.targets ? JSON.parse(JSON.stringify(q.targets)) : [];
                _fqImPathVal  = q.media?.path || '';
                _fqImImageSrc = _fqImPathVal || null;
            }
            AdminShell.showPanel('fragen');
            if (q.type === QUESTION_TYPES.IMAGEMAP) _fqImRedraw();
        }

        function _fqCloseForm() {
            _fqEditIdx  = -1;
            _fqShowForm = false;
            AdminShell.showPanel('fragen');
        }

        function _fqSetType(type) {
            _fqFormType = type;
            if (type === QUESTION_TYPES.IMAGEMAP) _fqImReset();
            AdminShell.showPanel('fragen');
            if (type === QUESTION_TYPES.IMAGEMAP) _fqImRedraw();
        }

        function _fqRenderForm(container) {
            const isEdit  = _fqEditIdx >= 0;
            const eq      = isEdit ? questions[_fqEditIdx] : null;
            const groups  = [...new Set(questions.map(q => q._fileGroup || 'Manuell'))].sort();
            const isMC    = _fqFormType === QUESTION_TYPES.MULTIPLE_CHOICE;
            const isText  = _fqFormType === QUESTION_TYPES.TEXT;
            const isIm    = _fqFormType === QUESTION_TYPES.IMAGEMAP;

            // Vorausgefüllte Werte aus bestehender Frage
            const prefillText      = _fqEsc(eq?.text || '');
            const prefillGroup     = eq?._fileGroup || '';
            const prefillMedia     = (!isIm && eq?.media?.path)          ? _fqEsc(eq.media.path)           : '';
            const prefillExpl      = _fqEsc(eq?.explanation || '');
            const prefillExplMedia = _fqEsc(eq?.explanationMedia?.path || '');
            const prefillHint      = _fqEsc(eq?.hint || '');
            const prefillHintMedia = _fqEsc(eq?.hintMedia?.path || '');

            // ID-Feld: bei Edit aktuelle ID, bei Neu vorgeschlagene ID
            const currentGroup = prefillGroup || (groups[0] || 'Manuell');
            const suggestedId  = isEdit ? _fqEsc(eq.questionId || '') : _fqEsc(assignStableId(currentGroup, questions));

            const groupOptions = groups.map(g =>
                `<option value="${_fqEsc(g)}" ${prefillGroup === g ? 'selected' : ''}>${_fqEsc(g)}</option>`
            ).join('');

            let answerFields;
            if (isMC) {
                const mcAnswers = (eq?.type === QUESTION_TYPES.MULTIPLE_CHOICE ? eq.answers : null) || [];
                answerFields = Array.from({ length: 4 }, (_, i) => {
                    const a = mcAnswers[i] || { text: '', correct: false };
                    return `
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                    <input type="checkbox" id="fqCorr_${i}" style="width:auto;margin:0;flex-shrink:0"
                        title="Korrekte Antwort" ${a.correct ? 'checked' : ''}>
                    <input type="text" id="fqAns_${i}" placeholder="Antwort ${i + 1}"
                        value="${_fqEsc(a.text)}"
                        style="margin:0;flex:1;padding:8px 12px;font-size:0.9rem">
                </div>`;
                }).join('');
            } else if (isText) {
                const textVal = (eq?.type === QUESTION_TYPES.TEXT) ? getCorrectTextAnswers(eq).join('\n') : '';
                answerFields = `
                <textarea id="fqTextAns" rows="3" placeholder="Eine korrekte Antwort pro Zeile"
                    style="margin:0;resize:vertical;font-size:0.9rem">${_fqEsc(textVal)}</textarea>`;
            } else {
                answerFields = _fqImBuildHTML();
            }

            const mediaOpen = prefillMedia ? 'open' : '';
            const explOpen  = (prefillExpl || prefillExplMedia) ? 'open' : '';
            const hintOpen  = (prefillHint || prefillHintMedia) ? 'open' : '';

            const mediaSection = isIm ? '' : `
                    <details style="margin-top:12px" ${mediaOpen}>
                        <summary style="cursor:pointer;opacity:0.7;font-size:0.85rem;padding:4px 0">
                            Bild / Media (optional)
                        </summary>
                        <div style="display:flex;gap:6px;align-items:center;margin-top:6px">
                            <input type="text" id="fqMedia" value="${prefillMedia}"
                                placeholder="Pfad zur Bilddatei, z.B. bilder/frage01.jpg"
                                style="margin:0;flex:1;font-size:0.9rem">
                            <input type="file" id="fqMediaFile" accept="image/*" style="display:none"
                                onchange="_fqHandleMediaBrowse(event,'fqMedia')">
                            <button class="btn btn-small btn-secondary"
                                onclick="document.getElementById('fqMediaFile').click()"
                                style="white-space:nowrap;padding:4px 10px;font-size:0.8rem;background:var(--overlay-10);box-shadow:none">
                                📂 Durchsuchen
                            </button>
                        </div>
                    </details>`;

            container.innerHTML = `
                <div class="card">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
                        <button class="btn btn-small btn-secondary" onclick="_fqCloseForm()"
                            style="background:var(--overlay-10);box-shadow:none">
                            ← Zurück
                        </button>
                        <h2 style="margin:0;font-size:1.2rem">${isEdit ? 'Frage bearbeiten' : 'Neue Frage'}</h2>
                    </div>

                    <!-- Typ -->
                    <label>Typ</label>
                    <div style="display:flex;gap:8px;margin-bottom:4px">
                        <button class="btn btn-small ${isMC ? '' : 'btn-secondary'}"
                            onclick="_fqSetType('${QUESTION_TYPES.MULTIPLE_CHOICE}')"
                            style="${isMC ? '' : 'background:var(--overlay-10);box-shadow:none'}">
                            ☑ Multiple Choice
                        </button>
                        <button class="btn btn-small ${isText ? '' : 'btn-secondary'}"
                            onclick="_fqSetType('${QUESTION_TYPES.TEXT}')"
                            style="${isText ? '' : 'background:var(--overlay-10);box-shadow:none'}">
                            📝 Freitext
                        </button>
                        <button class="btn btn-small ${isIm ? '' : 'btn-secondary'}"
                            onclick="_fqSetType('${QUESTION_TYPES.IMAGEMAP}')"
                            style="${isIm ? '' : 'background:var(--overlay-10);box-shadow:none'}">
                            🗺 Bildklick
                        </button>
                    </div>

                    <!-- Text -->
                    <label for="fqText">Fragetext *</label>
                    <textarea id="fqText" rows="3" placeholder="Fragetext eingeben…"
                        style="margin:0;resize:vertical">${prefillText}</textarea>

                    <!-- Gruppe -->
                    <label for="fqGroup">Gruppe</label>
                    <select id="fqGroup" onchange="_fqToggleNewGroup(this.value);_fqUpdateIdSuggestion()"
                        style="margin:0 0 6px">
                        ${groupOptions}
                        <option value="__new__">+ Neue Gruppe…</option>
                    </select>
                    <input type="text" id="fqGroupNew" placeholder="Neuer Gruppenname"
                        oninput="_fqUpdateIdSuggestion()"
                        style="display:none;margin:0 0 6px;padding:8px 12px;font-size:0.9rem">

                    <!-- Fragen-ID -->
                    <label for="fqQuestionId">Fragen-ID</label>
                    <input type="text" id="fqQuestionId" value="${suggestedId}"
                        placeholder="prefix_00001"
                        style="margin:0 0 2px;font-family:monospace;font-size:0.9rem">
                    <div id="fqIdHint" style="font-size:0.78rem;opacity:0.55;margin-bottom:8px;min-height:1em"></div>

                    <!-- Antworten / Zonen -->
                    <label>${isMC ? 'Antworten (✓ = korrekt)' : isText ? 'Korrekte Antworten' : 'Zielzonen'}</label>
                    <div id="fqAnswers">${answerFields}</div>

                    ${mediaSection}

                    <!-- Erklärung -->
                    <details style="margin-top:8px" ${explOpen}>
                        <summary style="cursor:pointer;opacity:0.7;font-size:0.85rem;padding:4px 0">
                            Erklärung (optional)
                        </summary>
                        <textarea id="fqExpl" rows="2" placeholder="Erklärungstext nach der Antwort"
                            style="margin:8px 0 4px;resize:vertical;font-size:0.9rem">${prefillExpl}</textarea>
                        <div style="display:flex;gap:6px;align-items:center">
                            <input type="text" id="fqExplMedia" value="${prefillExplMedia}"
                                placeholder="Pfad zum Erklärungs-Bild" style="margin:0;flex:1;font-size:0.9rem">
                            <input type="file" id="fqExplMediaFile" accept="image/*" style="display:none"
                                onchange="_fqHandleMediaBrowse(event,'fqExplMedia')">
                            <button class="btn btn-small btn-secondary"
                                onclick="document.getElementById('fqExplMediaFile').click()"
                                style="padding:4px 8px;font-size:0.78rem;background:var(--overlay-10);box-shadow:none">📂</button>
                        </div>
                    </details>

                    <!-- Hinweis -->
                    <details style="margin-top:8px" ${hintOpen}>
                        <summary style="cursor:pointer;opacity:0.7;font-size:0.85rem;padding:4px 0">
                            Hinweis (optional)
                        </summary>
                        <textarea id="fqHint" rows="2" placeholder="Hinweistext für Hint-Fähigkeit"
                            style="margin:8px 0 4px;resize:vertical;font-size:0.9rem">${prefillHint}</textarea>
                        <div style="display:flex;gap:6px;align-items:center">
                            <input type="text" id="fqHintMedia" value="${prefillHintMedia}"
                                placeholder="Pfad zum Hinweis-Bild" style="margin:0;flex:1;font-size:0.9rem">
                            <input type="file" id="fqHintMediaFile" accept="image/*" style="display:none"
                                onchange="_fqHandleMediaBrowse(event,'fqHintMedia')">
                            <button class="btn btn-small btn-secondary"
                                onclick="document.getElementById('fqHintMediaFile').click()"
                                style="padding:4px 8px;font-size:0.78rem;background:var(--overlay-10);box-shadow:none">📂</button>
                        </div>
                    </details>

                    <div style="display:flex;gap:10px;margin-top:24px">
                        <button class="btn btn-small" onclick="_fqSave()">
                            💾 ${isEdit ? 'Änderungen speichern' : 'Frage speichern'}
                        </button>
                        <button class="btn btn-small btn-secondary" onclick="_fqCloseForm()"
                            style="background:var(--overlay-10);box-shadow:none">
                            Abbrechen
                        </button>
                    </div>
                </div>`;
        }

        function _fqToggleNewGroup(val) {
            const input = document.getElementById('fqGroupNew');
            if (input) input.style.display = val === '__new__' ? 'block' : 'none';
        }

        function _fqCurrentGroup() {
            const sel = document.getElementById('fqGroup');
            if (!sel) return 'Manuell';
            if (sel.value === '__new__') {
                const inp = document.getElementById('fqGroupNew');
                return (inp?.value || '').trim() || 'Manuell';
            }
            return sel.value || 'Manuell';
        }

        function _fqUpdateIdSuggestion() {
            const idInput = document.getElementById('fqQuestionId');
            const hint    = document.getElementById('fqIdHint');
            if (!idInput || !hint) return;
            const group     = _fqCurrentGroup();
            const suggested = assignStableId(group, questions);
            hint.textContent = 'Nächste freie ID für "' + group + '": ' + suggested;
        }

        // ── Speichern ─────────────────────────────────────────────────────────────────

        function _fqSave() {
            const text = (document.getElementById('fqText')?.value || '').trim();
            if (!text) { Toast.show('Fragetext darf nicht leer sein.', 'warning'); return; }

            // Gruppe
            const groupSel = document.getElementById('fqGroup')?.value || 'Manuell';
            let group = groupSel === '__new__'
                ? (document.getElementById('fqGroupNew')?.value || '').trim() || 'Manuell'
                : groupSel;

            // Antworten validieren
            let answers, correctAnswer, targets, correctMode;
            if (_fqFormType === QUESTION_TYPES.MULTIPLE_CHOICE) {
                answers = Array.from({ length: 4 }, (_, i) => ({
                    text:    (document.getElementById('fqAns_' + i)?.value || '').trim(),
                    correct: document.getElementById('fqCorr_' + i)?.checked || false
                })).filter(a => a.text);
                if (!answers.length) { Toast.show('Mindestens eine Antwort angeben.', 'warning'); return; }
                if (!answers.some(a => a.correct)) { Toast.show('Mindestens eine Antwort als korrekt markieren.', 'warning'); return; }
                correctMode = document.getElementById('fqCorrectModeAny')?.checked ? 'any' : null;
            } else if (_fqFormType === QUESTION_TYPES.TEXT) {
                const raw = (document.getElementById('fqTextAns')?.value || '').trim();
                if (!raw) { Toast.show('Mindestens eine korrekte Antwort angeben.', 'warning'); return; }
                correctAnswer = raw.split('\n').map(s => s.trim()).filter(Boolean);
                answers = [{ type: 'text', correctAnswers: correctAnswer }];
            } else {
                // Imagemap
                targets = _fqGetTargets();
                if (!targets.length) { Toast.show('Mindestens eine Zielzone definieren.', 'warning'); return; }
                if (!_fqImImageSrc) { Toast.show('Bitte zuerst ein Bild laden!', 'warning'); return; }
            }

            // Media
            const mediaPath   = (document.getElementById('fqMedia')?.value || '').trim();
            const explText    = (document.getElementById('fqExpl')?.value || '').trim();
            const explMedia   = (document.getElementById('fqExplMedia')?.value || '').trim();
            const hintText    = (document.getElementById('fqHint')?.value || '').trim();
            const hintMedia   = (document.getElementById('fqHintMedia')?.value || '').trim();

            const imMedia = _fqFormType === QUESTION_TYPES.IMAGEMAP && _fqImPathVal
                ? { type: 'image', path: _fqImPathVal } : null;
            const resolvedMedia = imMedia || (mediaPath ? { type: 'image', path: mediaPath } : null);

            // ID aus Eingabefeld lesen
            const enteredId = (document.getElementById('fqQuestionId')?.value || '').trim();
            if (!enteredId) { Toast.show('Fragen-ID darf nicht leer sein.', 'warning'); return; }

            // Duplikat-Check: ID darf nicht bei einer anderen Frage vergeben sein
            const editQ      = _fqEditIdx >= 0 ? questions[_fqEditIdx] : null;
            const duplicate  = questions.find((q, i) => q.questionId === enteredId && i !== _fqEditIdx);
            if (duplicate) {
                const nextFree = assignStableId(group, questions);
                Toast.show(`ID "${enteredId}" ist bereits vergeben. Nächste freie: ${nextFree}`, 'warning');
                return;
            }

            if (_fqEditIdx >= 0) {
                // ── Bestehende Frage aktualisieren ──────────────────────────────────
                const q        = questions[_fqEditIdx];
                q.questionId       = enteredId;
                q.text             = text;
                q.type             = _fqFormType;
                q._fileGroup       = group;
                q.media            = resolvedMedia;
                q.explanation      = explText  || null;
                q.explanationMedia = explMedia ? { type: 'image', path: explMedia } : null;
                q.hint             = hintText  || null;
                q.hintMedia        = hintMedia ? { type: 'image', path: hintMedia } : null;
                delete q.answers; delete q.correctAnswer; delete q.targets; delete q.correctMode;
                if (_fqFormType === QUESTION_TYPES.TEXT) {
                    q.correctAnswer = correctAnswer;
                    q.answers       = answers;
                } else if (_fqFormType === QUESTION_TYPES.IMAGEMAP) {
                    q.targets = targets;
                } else {
                    q.answers = answers;
                    if (correctMode) q.correctMode = correctMode;
                }
                Toast.show(`Frage ${q.questionId} aktualisiert.`, 'success');
            } else {
                // ── Neue Frage anlegen ───────────────────────────────────────────────
                const newQ = {
                    questionId:      enteredId,
                    text,
                    type:            _fqFormType,
                    active:          true,
                    _fileGroup:      group,
                    media:           resolvedMedia,
                    explanation:     explText  || null,
                    explanationMedia:explMedia ? { type: 'image', path: explMedia } : null,
                    hint:            hintText  || null,
                    hintMedia:       hintMedia ? { type: 'image', path: hintMedia } : null,
                };
                if (_fqFormType === QUESTION_TYPES.TEXT) {
                    newQ.correctAnswer = correctAnswer;
                    newQ.answers       = answers;
                } else if (_fqFormType === QUESTION_TYPES.IMAGEMAP) {
                    newQ.targets = targets;
                } else {
                    newQ.answers = answers;
                    if (correctMode) newQ.correctMode = correctMode;
                }
                questions.push(newQ);
                Toast.show(`Frage ${enteredId} erstellt (${group}).`, 'success');
            }

            _fqEditIdx  = -1;
            _fqShowForm = false;
            AdminShell.showPanel('fragen');
        }

        // ── Export ────────────────────────────────────────────────────────────────────

        function _fqStartExport() {
            if (!questions.length) { Toast.show('Keine Fragen zum Exportieren.', 'warning'); return; }

            // Fragen nach Gruppe gruppieren
            const byGroup = {};
            questions.forEach(q => {
                const g = q._fileGroup || 'Manuell';
                if (!byGroup[g]) byGroup[g] = [];
                byGroup[g].push(q);
            });

            const ts = new Date().toISOString().slice(0, 19).replace('T', '_').replace(/:/g, '');

            Object.entries(byGroup).forEach(([group, qs]) => {
                const safeName = group.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, '_');
                const data = {
                    theme:     group,
                    questions: qs.map(_fqBuildExportQ)
                };
                const filename = `03_questions_${safeName}_${ts}.json`;
                _fqDownload(JSON.stringify(data, null, 2), filename);
            });

            Toast.show(`${Object.keys(byGroup).length} Datei(en) exportiert.`, 'success');
        }

        function _fqBuildExportQ(q) {
            const out = {
                questionId:      q.questionId,
                text:            q.text,
                type:            q.type,
                active:          q.active !== false,
                media:           q.media || null,
                explanation:     q.explanation || null,
                explanationMedia:q.explanationMedia || null,
                hint:            q.hint || null,
                hintMedia:       q.hintMedia || null,
                _fileGroup:      q._fileGroup || 'Manuell',
            };
            if (q.type === QUESTION_TYPES.TEXT) {
                out.correctAnswer = getCorrectTextAnswers(q);
            } else if (q.type === QUESTION_TYPES.IMAGEMAP) {
                out.targets = q.targets;
            } else {
                out.answers = q.answers;
            }
            return out;
        }

        function _fqDownload(content, filename) {
            if (quizSettings?.encryptPlayerData) {
                try { content = btoa(unescape(encodeURIComponent(content))); } catch (e) {}
            }
            const blob = new Blob([content], { type: 'application/json' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        // ── Imagemap Editor ───────────────────────────────────────────────────────────

        function _fqImReset() {
            _fqImMode         = 'circle';
            _fqImPoints       = [];
            _fqImRadius       = 5;
            _fqImZones        = [];
            _fqImPolyFinalized = false;
            _fqImDragIdx      = -1;
            _fqImImageSrc     = null;
            _fqImPathVal      = '';
        }

        function _fqImBuildHTML() {
            const isCi   = _fqImMode === 'circle';
            const isPoly = _fqImMode === 'polygon';

            let controls = `
                <div style="display:flex;gap:8px;margin-bottom:8px">
                    <button class="btn btn-small ${isCi ? '' : 'btn-secondary'}"
                        onclick="_fqImMode='circle';_fqImPoints=[];_fqImPolyFinalized=false;_fqImRefresh()"
                        style="${isCi ? '' : 'background:var(--overlay-10);box-shadow:none'}">
                        ⭕ Kreis
                    </button>
                    <button class="btn btn-small ${isPoly ? '' : 'btn-secondary'}"
                        onclick="_fqImMode='polygon';_fqImPoints=[];_fqImPolyFinalized=false;_fqImRefresh()"
                        style="${isPoly ? '' : 'background:var(--overlay-10);box-shadow:none'}">
                        🔷 Polygon
                    </button>
                </div>`;

            if (isCi) {
                controls += `
                <div style="display:flex;gap:15px;align-items:center;margin-bottom:8px">
                    <label style="font-size:0.82rem;margin:0">Radius: <strong id="fqImRadVal">${_fqImRadius}</strong>%</label>
                    <input type="range" min="1" max="15" value="${_fqImRadius}" step="0.5"
                        oninput="_fqImRadius=parseFloat(this.value);document.getElementById('fqImRadVal').textContent=this.value;_fqImRedraw()"
                        style="flex:1;margin:0">
                </div>`;
            }

            if (isPoly) {
                const canClose = _fqImPoints.length >= 3 && !_fqImPolyFinalized;
                controls += `
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
                    <button class="btn btn-small btn-secondary" style="background:var(--overlay-10);box-shadow:none"
                        onclick="_fqImPoints.pop();_fqImPolyFinalized=false;_fqImRefresh()">↩ Letzten Punkt</button>
                    <button class="btn btn-small btn-secondary" style="background:var(--overlay-10);box-shadow:none"
                        onclick="_fqImPoints=[];_fqImPolyFinalized=false;_fqImRefresh()">✕ Alle Punkte</button>
                    ${canClose ? `<button class="btn btn-small" onclick="_fqImPolyFinalized=true;_fqImRefresh()">🔷 Polygon schließen</button>` : ''}
                    <span style="font-size:0.8rem;opacity:0.6;padding:4px">${_fqImPoints.length} Punkte</span>
                </div>`;
            }

            const imgContent = _fqImImageSrc
                ? `<img id="fqImgEl" src="${_fqImImageSrc}" onclick="_fqImClick(event)"
                      style="width:100%;display:block;user-select:none;cursor:crosshair">`
                : `<p style="padding:40px;text-align:center;opacity:0.4">Bild laden um Zielzonen zu definieren</p>`;

            return `
                <div id="fqImSection" style="padding:12px;background:var(--overlay-5);border:1px solid var(--overlay-15);border-radius:12px;margin:0">
                    <!-- Bild-Loader -->
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
                        <input type="text" id="fqImgPath" value="${_fqEsc(_fqImPathVal)}"
                            placeholder="Bildpfad (z.B. medien/karte.jpg)"
                            style="flex:1;margin:0;padding:8px 12px;font-size:0.85rem">
                        <input type="file" id="fqImgFileInput" accept="image/*" style="display:none" onchange="_fqImLoadFile(event)">
                        <button class="btn btn-small btn-secondary" style="background:var(--overlay-10);box-shadow:none;white-space:nowrap"
                            onclick="document.getElementById('fqImgFileInput').click()">📁 Bild</button>
                        <button class="btn btn-small" style="white-space:nowrap" onclick="_fqImLoadPath()">Laden</button>
                    </div>
                    <!-- Modus-Controls -->
                    ${controls}
                    <!-- Zone speichern -->
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
                        <button class="btn btn-small" onclick="_fqImAddZone()">＋ Zone speichern</button>
                        <span style="font-size:0.82rem;opacity:0.5">${_fqImZones.length} Zonen</span>
                    </div>
                    <!-- Zone-Liste -->
                    <div id="fqImZoneInfo" style="margin-bottom:8px"></div>
                    <!-- Bild-Bereich -->
                    <div id="fqImgArea" style="position:relative;border:2px dashed var(--overlay-20);border-radius:10px;overflow:hidden;cursor:crosshair;min-height:100px">
                        ${imgContent}
                    </div>
                </div>`;
        }

        function _fqImRefresh() {
            const section = document.getElementById('fqImSection');
            if (!section) return;
            _fqImPathVal = document.getElementById('fqImgPath')?.value || _fqImPathVal;
            section.outerHTML = _fqImBuildHTML();
            _fqImRedraw();
        }

        function _fqImRedraw() {
            const area = document.getElementById('fqImgArea');
            if (!area) return;

            // Remove old overlays
            area.querySelectorAll('.fqIm-overlay').forEach(el => el.remove());

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('preserveAspectRatio', 'none');
            svg.setAttribute('class', 'fqIm-overlay');
            svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20';

            let svgContent = '';

            // Gespeicherte Zonen (grün)
            _fqImZones.forEach(zone => {
                if (zone.mode === 'circle') {
                    svgContent += `<circle cx="${zone.x}" cy="${zone.y}" r="${zone.radius}" fill="rgba(46,204,113,0.15)" stroke="rgba(46,204,113,0.8)" stroke-width="0.4"/>`;
                } else if (zone.mode === 'polygon' && zone.points?.length >= 3) {
                    const pts = zone.points.map(p => `${p.x},${p.y}`).join(' ');
                    svgContent += `<polygon points="${pts}" fill="rgba(46,204,113,0.2)" stroke="rgba(46,204,113,0.8)" stroke-width="0.4"/>`;
                }
            });

            // Aktuelle Form (rot)
            if (_fqImMode === 'circle' && _fqImPoints.length > 0) {
                const p = _fqImPoints[0];
                svgContent += `<circle cx="${p.x}" cy="${p.y}" r="${_fqImRadius}" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.8)" stroke-width="0.4" stroke-dasharray="1,0.5"/>`;
                svgContent += `<circle cx="${p.x}" cy="${p.y}" r="1" fill="#e74c3c" stroke="#fff" stroke-width="0.3"/>`;
            } else if (_fqImMode === 'polygon' && _fqImPoints.length > 0) {
                if (_fqImPoints.length > 1) {
                    const pts = _fqImPoints.map(p => `${p.x},${p.y}`).join(' ');
                    if (_fqImPolyFinalized) {
                        svgContent += `<polygon points="${pts}" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.8)" stroke-width="0.4"/>`;
                    } else {
                        svgContent += `<polyline points="${pts}" fill="none" stroke="rgba(231,76,60,0.8)" stroke-width="0.4" stroke-dasharray="1,0.5"/>`;
                    }
                }
                _fqImPoints.forEach((p, i) => {
                    svgContent += `<circle cx="${p.x}" cy="${p.y}" r="1.2" fill="#e74c3c" stroke="#fff" stroke-width="0.25"/>`;
                    svgContent += `<text x="${p.x}" y="${p.y + 0.4}" text-anchor="middle" dominant-baseline="central" font-size="1.4" fill="#fff" font-weight="900" style="pointer-events:none">${i + 1}</text>`;
                });
            }

            svg.innerHTML = svgContent;
            area.appendChild(svg);

            // Polygon-Drag-Handles (echte DOM-Elemente für Mouse-Events)
            if (_fqImMode === 'polygon' && _fqImPoints.length > 0) {
                _fqImPoints.forEach((p, i) => {
                    const handle = document.createElement('div');
                    handle.className = 'fqIm-overlay';
                    handle.style.cssText = 'position:absolute;width:18px;height:18px;background:transparent;border-radius:50%;transform:translate(-50%,-50%);z-index:25;cursor:move';
                    handle.style.left = p.x + '%';
                    handle.style.top  = p.y + '%';
                    handle.addEventListener('mousedown', ev => {
                        ev.stopPropagation();
                        _fqImDragIdx = i;
                        function onMove(me) {
                            const imgEl = area.querySelector('img');
                            if (!imgEl) return;
                            const rect = imgEl.getBoundingClientRect();
                            _fqImPoints[_fqImDragIdx].x = Math.max(0, Math.min(100, ((me.clientX - rect.left) / rect.width) * 100));
                            _fqImPoints[_fqImDragIdx].y = Math.max(0, Math.min(100, ((me.clientY - rect.top) / rect.height) * 100));
                            _fqImRedraw();
                        }
                        function onUp() {
                            _fqImDragIdx = -1;
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onUp);
                        }
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                    });
                    area.appendChild(handle);
                });
            }

            // Zone-Info live aktualisieren
            const counterEl = document.getElementById('fqImZoneInfo');
            if (counterEl) {
                if (_fqImZones.length > 0) {
                    let info = '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
                    _fqImZones.forEach((z, i) => {
                        const label = `${i + 1}. ${z.mode === 'circle' ? 'Kreis' : 'Polygon'}`;
                        info += `<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3);padding:4px 10px;border-radius:6px;font-size:0.82rem">`;
                        info += `<span style="color:var(--correct)">${label}</span>`;
                        info += `<span onclick="_fqImZoneDelete(${i})" style="cursor:pointer;color:#e74c3c;font-weight:700;margin-left:4px" title="Zone löschen">✕</span>`;
                        info += `</span>`;
                    });
                    info += '</div>';
                    counterEl.innerHTML = info;
                } else {
                    counterEl.innerHTML = '';
                }
            }
        }

        function _fqImZoneDelete(i) {

        function _fqImClick(event) {
            if (_fqImDragIdx >= 0) return;
            const img  = event.target;
            const rect = img.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 100;
            const y = ((event.clientY - rect.top)  / rect.height) * 100;
            if (_fqImMode === 'circle') {
                _fqImPoints = [{ x, y }];
            } else {
                if (!_fqImPolyFinalized) _fqImPoints.push({ x, y });
            }
            _fqImRedraw();
        }

        function _fqImLoadPath() {
            const pathEl = document.getElementById('fqImgPath');
            if (!pathEl?.value.trim()) { Toast.show('Bitte Bildpfad eingeben!', 'warning'); return; }
            _fqImPathVal  = pathEl.value.trim();
            _fqImImageSrc = _fqImPathVal;
            _fqImRefresh();
        }

        function _fqImLoadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                _fqImImageSrc = e.target.result;
                const pathEl = document.getElementById('fqImgPath');
                if (pathEl && !pathEl.value.trim()) {
                    _fqImPathVal = 'medien/' + file.name;
                } else {
                    _fqImPathVal = pathEl?.value || '';
                }
                _fqImRefresh();
            };
            reader.readAsDataURL(file);
        }

        function _fqImAddZone() {
            if (_fqImMode === 'circle' && _fqImPoints.length > 0) {
                _fqImZones.push({ mode: 'circle',
                    x: Math.round(_fqImPoints[0].x * 100) / 100,
                    y: Math.round(_fqImPoints[0].y * 100) / 100,
                    radius: _fqImRadius });
                _fqImPoints = [];
            } else if (_fqImMode === 'polygon' && _fqImPoints.length >= 3) {
                _fqImZones.push({ mode: 'polygon',
                    points: _fqImPoints.map(p => ({ x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 })),
                    tolerance: 2 });
                _fqImPoints = [];
                _fqImPolyFinalized = false;
            } else {
                Toast.show(_fqImMode === 'circle' ? 'Erst auf Bild klicken.' : 'Mindestens 3 Punkte setzen.', 'warning');
                return;
            }
            _fqImRedraw();
            Toast.show(`Zone ${_fqImZones.length} gespeichert!`, 'success');
        }

        function _fqGetTargets() {
            const targets = JSON.parse(JSON.stringify(_fqImZones));
            if (_fqImMode === 'circle' && _fqImPoints.length > 0) {
                targets.push({ mode: 'circle',
                    x: Math.round(_fqImPoints[0].x * 100) / 100,
                    y: Math.round(_fqImPoints[0].y * 100) / 100,
                    radius: _fqImRadius });
            } else if (_fqImMode === 'polygon' && _fqImPoints.length >= 3) {
                targets.push({ mode: 'polygon',
                    points: _fqImPoints.map(p => ({ x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 })),
                    tolerance: 2 });
            }
            return targets;
        }

        function _fqEsc(s) {

        function _fqHandleImport(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            let totalAdded = 0, totalDupes = 0;

            function processFile(file) {
                return new Promise(function(resolve) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            let raw = e.target.result;
                            try { raw = decodeURIComponent(escape(atob(raw))); } catch(ex) {}
                            const data = JSON.parse(raw);
                            const importedQuestions = data.questions || data.fragen || [];
                            const importTheme = data.theme || file.name.replace('.json', '');
                            let added = 0, dupes = 0;
                            importedQuestions.forEach(function(iq) {
                                const normalized = typeof normalizeQuestion === 'function' ? normalizeQuestion(iq) : iq;
                                normalized._fileGroup = iq._fileGroup || importTheme;
                                const isDupe = normalized.questionId && questions.some(function(eq) {
                                    return eq.questionId === normalized.questionId;
                                });
                                if (isDupe) { dupes++; }
                                else {
                                        questions.push(normalized);
                                    added++;
                                }
                            });
                            totalAdded += added;
                            totalDupes += dupes;
                        } catch(err) {
                            Toast.show('Fehler in ' + file.name + ': ' + err.message, 'warning');
                        }
                        resolve();
                    };
                    reader.readAsText(file);
                });
            }

            Promise.all(files.map(processFile)).then(function() {
                AdminShell.showPanel('fragen');
                let msg = '📥 ' + totalAdded + ' Fragen importiert!';
                if (totalDupes > 0) msg += '\n⚠️ ' + totalDupes + ' Duplikat(e) übersprungen.';
                Toast.show(msg, 'success');
            });
            event.target.value = '';
        }

        function _adminEinstellungenSave() {
            if (!quizSettings.abilityOverrides) quizSettings.abilityOverrides = {};
            let changed = 0;
            _ADMIN_ABILITY_DEFS.forEach(def => {
                const input = document.getElementById('earnPer_' + def.key);
                if (!input) return;
                const val = parseInt(input.value, 10);
                if (isNaN(val) || val < 1) { input.style.borderColor = 'var(--incorrect)'; return; }
                input.style.borderColor = '';
                if (val !== def.defaultEarnPer) {
                    quizSettings.abilityOverrides[def.key] = { earnPer: val };
                    changed++;
                } else {
                    delete quizSettings.abilityOverrides[def.key];
                }
            });
            saveMasterBackup();
            const hint = document.getElementById('einstellungen_hint');
            if (hint) hint.textContent = changed > 0 ? `${changed} Override(s) gespeichert` : 'Alle Werte auf Standard';
        }

        function _adminEinstellungenReset() {
            _ADMIN_ABILITY_DEFS.forEach(def => {
                const input = document.getElementById('earnPer_' + def.key);
                if (input) input.value = def.defaultEarnPer;
            });
            const hint = document.getElementById('einstellungen_hint');
            if (hint) hint.textContent = 'Werte zurückgesetzt — noch nicht gespeichert';
        }

        // ── Avatar-Hilfsfunktionen ─────────────────────────────────────────────────────

        function _adminAvatarSetPreset(p) {
            quizSettings.avatarPreset = p;
            // Tabelle neu aufbauen mit korrekter Vorschau
            if (!quizSettings.avatars) quizSettings.avatars = {};
            const av = quizSettings.avatars;
            const previewKey = p === 2 ? 'image2' : 'image';
            const tbody = document.getElementById('avatarTableBody');
            if (!tbody) return;
            tbody.querySelectorAll('tr').forEach((tr, i) => {
                const lv = _AVATAR_LEVELS[i];
                if (!lv) return;
                const avData = av[lv.key] || {};
                const previewSrc = avData[previewKey];
                const td = tr.querySelector('td:first-child');
                if (td) td.innerHTML = previewSrc
                    ? `<img src="${previewSrc}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--overlay-20)">`
                    : `<span style="font-size:1.8rem">${avData.icon || '?'}</span>`;
            });
        }

        function _adminAvatarUpload(levelKey, event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                if (!quizSettings.avatars) quizSettings.avatars = {};
                if (!quizSettings.avatars[levelKey]) quizSettings.avatars[levelKey] = { icon: '?', image: null, image2: null };
                const preset = quizSettings.avatarPreset || 1;
                const field = preset === 2 ? 'image2' : 'image';
                quizSettings.avatars[levelKey][field] = e.target.result;
                _adminAvatarSetPreset(preset);
                Toast.show(`Bild für ${levelKey} (Preset ${preset}) gesetzt.`, 'success');
            };
            reader.readAsDataURL(file);
        }

        function _adminAvatarRemove(levelKey) {
            if (!quizSettings.avatars || !quizSettings.avatars[levelKey]) return;
            const preset = quizSettings.avatarPreset || 1;
            const field = preset === 2 ? 'image2' : 'image';
            quizSettings.avatars[levelKey][field] = null;
            _adminAvatarSetPreset(preset);
            Toast.show(`Bild entfernt (${levelKey}, Preset ${preset}).`, 'success');
        }

        // ── Helpers: Daten ────────────────────────────────────────────────────────────

        function _avGroupPrefix(qid) {
            const m = String(qid).match(/^([a-z]+)_/);
            return m ? m[1] : '__none__';
        }

        function _avGroupLabel(prefix) {
            // Versuche echten _fileGroup-Namen aus questions-Array zu lesen
            if (typeof questions !== 'undefined') {
                const q = questions.find(q => q.questionId && _avGroupPrefix(q.questionId) === prefix);
                if (q && q._fileGroup) return q._fileGroup;
            }
            return prefix.charAt(0).toUpperCase() + prefix.slice(1);
        }

        function _avAllPrefixes() {
            const s = new Set();
            users.forEach(u => Object.keys(u.questionStats || {}).forEach(qid => s.add(_avGroupPrefix(qid))));
            s.delete('__none__');
            return [...s].sort();
        }

        function _avUserGroupStats(user) {
            const gs = {};
            Object.entries(user.questionStats || {}).forEach(([qid, stat]) => {
                const g = _avGroupPrefix(qid);
                if (g === '__none__') return;
                if (!gs[g]) gs[g] = { asked: 0, correct: 0, questions: 0 };
                gs[g].asked    += stat.asked    || 0;
                gs[g].correct  += stat.correct  || 0;
                gs[g].questions++;
            });
            return gs;
        }

        function _avAggregateStats() {
            // Returns { qid: { asked, correct, userCount, _q, users[], monthlyStats{} } }
            const agg = {};
            users.forEach(u => {
                Object.entries(u.questionStats || {}).forEach(([qid, stat]) => {
                    if (!agg[qid]) agg[qid] = { asked: 0, correct: 0, userCount: 0, _q: stat._q || '', users: [], monthlyStats: {} };
                    agg[qid].asked    += stat.asked   || 0;
                    agg[qid].correct  += stat.correct || 0;
                    agg[qid].userCount++;
                    agg[qid].users.push({ name: u.name, asked: stat.asked || 0, correct: stat.correct || 0,
                        consecutiveCorrect: stat.consecutiveCorrect || 0, lastAsked: stat.lastAsked,
                        askLog: stat.askLog || [], monthlyStats: stat.monthlyStats || {} });
                    // Merge monthly stats across users
                    Object.entries(stat.monthlyStats || {}).forEach(([mo, ms]) => {
                        if (!agg[qid].monthlyStats[mo]) agg[qid].monthlyStats[mo] = { asked: 0, correct: 0 };
                        agg[qid].monthlyStats[mo].asked   += ms.asked   || 0;
                        agg[qid].monthlyStats[mo].correct += ms.correct || 0;
                    });
                });
            });
            return agg;
        }

        function _avIsNew(qid, daysThreshold = 30) {
            if (typeof questions === 'undefined') return false;
            const q = questions.find(q => q.questionId === qid);
            if (!q || !q._createdAt) return false;
            return (Date.now() - new Date(q._createdAt).getTime()) < daysThreshold * 86400000;
        }

        function _avCreatedAt(qid) {
            if (typeof questions === 'undefined') return null;
            const q = questions.find(qq => qq.questionId === qid);
            return q ? q._createdAt : null;
        }

        function _avSR() {
            const sr = (typeof quizSettings !== 'undefined' ? quizSettings.spacedRepetition : null) || {};
            return {
                threshold:  sr.streakThreshold || 2,
                cooldownMs: (sr.streakCooldown  || 48) * 3600000,
            };
        }

        function _avPct(correct, asked) {
            if (!asked) return null;
            return Math.round(correct / asked * 100);
        }

        function _avFmtDate(iso) {
            if (!iso) return '–';
            return iso.slice(0, 10);
        }

        // ── Helpers: SVG ─────────────────────────────────────────────────────────────

        const AV_COLORS = ['#FF6B35','#F7B801','#2ECC71','#3498DB','#9B59B6','#E74C3C','#1ABC9C','#E67E22','#F39C12','#16A085'];

        function _avGrpColor(prefix, prefixes) {
            const i = prefixes.indexOf(prefix);
            return AV_COLORS[i % AV_COLORS.length];
        }

        function _avScoreColor(pct) {
            if (pct === null) return 'var(--overlay-20)';
            if (pct >= 80) return 'var(--correct)';
            if (pct >= 50) return 'var(--accent)';
            return 'var(--incorrect)';
        }

        function _avSVG(w, h, content, extraStyle = '') {
            return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;${extraStyle}" font-family="inherit">${content}</svg>`;
        }

        function _avLinePath(pts) {
            if (!pts.length) return '';
            return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
        }

        function _avAreaPath(pts, baseY) {
            if (!pts.length) return '';
            return `${_avLinePath(pts)} L${pts[pts.length-1][0].toFixed(1)},${baseY} L${pts[0][0].toFixed(1)},${baseY} Z`;
        }

                ${content}
            </div>`;
        }

        function _avRenderNutzer(el) {

        function _avRenderNutzerCharts(user) {

            const history = user.history || [];
            const qs      = user.questionStats || {};
            const prefixes = _avAllPrefixes();

            el.innerHTML = [

                `<div style="${cols}">`,
                    _avVizCard('VIZ-N3', 'Gruppen-Kompass', _avVizGruppenKompass(qs, prefixes)),

                `<div style="${cols}">`,

<!-- Forge — Development Version (Split Files) -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge</title>
    <link rel="stylesheet" href="css/00-base.css">
    <link rel="stylesheet" href="css/01-screens.css">
    <link rel="stylesheet" href="css/02-admin.css">
    <link rel="stylesheet" href="css/03-plugins.css">
    <style>
        /* === Passwort-Modal (nach Datei-Load, wenn Passwort gesetzt) === */
        .forge-pw-modal {
            position: fixed;
            inset: 0;
            background: var(--shadow-70);
            z-index: 9000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .forge-pw-card {
            background: var(--bg-light);
            border: 1px solid var(--overlay-15);
            border-radius: 20px;
            padding: 40px;
            width: 340px;
            box-shadow: 0 20px 60px var(--shadow-50);
            text-align: center;
        }

        .forge-pw-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .forge-pw-error {
            color: var(--incorrect);
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 18px;
            display: none;
        }

        .forge-pw-error.active { display: block; }

        /* === Admin-Layout === */
        .admin-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .admin-nav {
            width: 190px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
        }

        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            background: var(--overlay-5);
            border: 1px solid var(--overlay-10);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            margin-bottom: 5px;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-nav-item:hover { background: var(--overlay-10); }

        .admin-nav-item.active {
            background: var(--overlay-12);
            border-color: var(--primary);
            color: var(--primary);
        }

        .admin-content { flex: 1; min-width: 0; }

        .admin-panel { display: none; }

        .admin-panel.active {
            display: block;
            animation: adminFadeIn 0.25s ease-out;
        }

        @keyframes adminFadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .admin-empty {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.4;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .admin-empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    </style>
</head>
<body>

<!-- Passwort-Modal — erscheint nach Datei-Load wenn adminPassword gesetzt -->
<div class="forge-pw-modal" id="forgePasswordModal">
    <div class="forge-pw-card">
        <div class="forge-pw-title">Forge · Passwort</div>
        <form onsubmit="forgeCheckPassword(event)">
            <input type="password" id="forgePasswordInput"
                placeholder="Admin-Passwort" autocomplete="current-password"
                style="margin-bottom:0">
            <div class="forge-pw-error" id="forgePasswordError">Falsches Passwort</div>
            <button type="submit" class="btn" style="width:100%;margin-top:16px">
                Einloggen
            </button>
        </form>
    </div>
</div>

<header>
    <h1>Forge</h1>
    <div class="subtitle">Quiz-System &middot; Data Maintenance</div>
</header>

<div class="container">
    <div class="admin-layout">
        <nav class="admin-nav" id="adminNav">
            <!-- wird durch AdminShell befüllt -->
        </nav>
        <main class="admin-content" id="adminContent">
            <!-- wird durch AdminShell befüllt -->
        </main>
    </div>
</div>

</body>
</html>
